    default_model: gpt-5-nano
    override_env: OPENAI_MODEL_FAST_TEST
prompt_contract:
  prompt_ref: prompt:sp_semantic_analysis@0.4.1
  schema_ref: schema:llm_semantic_analysis@0.4.1
  staged_runtime:
    sp_fan_out: true
    default_sp_concurrency_env: LLM_SP_CONCURRENCY
    default_sp_concurrency: 2
    dynamic_evidence_schema: true
    deterministic_review_marker_injection: true
    high_quality_default: true
    stages:
      - deterministic_evidence_digest
      - business_rule_extraction
      - conversion_readiness
      - migration_guide_insights
      - evidence_critic
      - repair
  allowed_output_fields:
