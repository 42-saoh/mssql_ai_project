    - modernization_points
    - risk_flags
    - review_markers
    - conversion_guidance
    - migration_guide_insights
    - assumptions
  required_evidence_type: LLM_INFERENCE
  unsupported_fact_status: REVIEW_REQUIRED
safety_expectations:
