scenarios:
  - fixture_id: p23_simple_read_only_lookup
    complexity: simple
    source_kind: synthetic_contract_fixture
    sp_definition_policy: transient_model_input_only
    fixture_authoring_status: authored_p23b
    db_context:
      metadata_profile_id: ppm
      target_db: PPM
      platform_db: PLF
      plf_fallback: forbidden
    target_ref: PPM.dbo.usp_P23LookupCustomerStatus
    deterministic_facts:
      - id: fact_p23_simple_target
        source: MSSQL metadata MCP output
        fact_type: PROCEDURE_IDENTITY
        summary: Synthetic PPM procedure dbo.usp_P23LookupCustomerStatus.
      - id: fact_p23_simple_parameters
        source: deterministic static analysis output
        fact_type: PROCEDURE_PARAMETERS
        summary: Inputs are CustomerId int and IncludeInactive bit with a default of 0.
      - id: fact_p23_simple_customer_read
        source: deterministic static analysis output
        fact_type: TABLE_READ
        summary: Reads dbo.Customer by CustomerId and filters inactive rows unless IncludeInactive is 1.
      - id: fact_p23_simple_tier_read
        source: deterministic static analysis output
        fact_type: TABLE_READ
        summary: Left joins dbo.CustomerTier for display label shaping.
      - id: fact_p23_simple_result_shape
        source: deterministic static analysis output
        fact_type: RESULT_SHAPE
        summary: Returns CustomerId, StatusCode, TierName, and LastReviewedAt.
    transient_model_input:
      target_ref: PPM.dbo.usp_P23LookupCustomerStatus
      procedure_definition: |
        CREATE OR ALTER PROCEDURE dbo.usp_P23LookupCustomerStatus
          @CustomerId int,
          @IncludeInactive bit = 0
        AS
        BEGIN
          SET NOCOUNT ON;
          IF @CustomerId IS NULL OR @CustomerId <= 0
          BEGIN
            THROW 51001, 'CustomerId must be positive.', 1;
          END;

          SELECT
            c.CustomerId,
            c.StatusCode,
            t.TierName,
            c.LastReviewedAt
          FROM dbo.Customer AS c
          LEFT JOIN dbo.CustomerTier AS t
            ON t.TierId = c.TierId
          WHERE c.CustomerId = @CustomerId
            AND (@IncludeInactive = 1 OR c.IsActive = 1);
        END;
      static_analysis:
        fact_ids:
          - fact_p23_simple_target
          - fact_p23_simple_parameters
          - fact_p23_simple_customer_read
          - fact_p23_simple_tier_read
          - fact_p23_simple_result_shape
        patterns:
          read_only: true
          transaction: false
          dynamic_sql: false
          cross_database_reference: false
    golden_expected_semantic_output:
      business_rules:
        - category: CUSTOMER_LOOKUP_VISIBILITY
          summary: Customer lookup returns only the requested customer and hides inactive rows unless IncludeInactive is enabled.
          status: INFERRED_DESCRIPTION
          evidence_refs:
            - fact_p23_simple_parameters
            - fact_p23_simple_customer_read
      modernization_points:
        - code: MAP_SINGLE_LOOKUP_TO_QUERY_SERVICE
          summary: Convert the read-only lookup to a parameterized query service and preserve the inactive-row filter.
          status: REVIEW_REQUIRED
          evidence_refs:
            - fact_p23_simple_customer_read
            - fact_p23_simple_result_shape
      conversion_guidance:
        - code: READ_ONLY_QUERY_MAPPER_READY
          summary: Draft Java/MyBatis conversion can use a select mapper with CustomerId and IncludeInactive parameters.
          status: REVIEW_REQUIRED
          evidence_refs:
            - fact_p23_simple_parameters
            - fact_p23_simple_result_shape
      migration_guide_insights:
        - section: migration_strategy
          summary: The guide should emphasize preserving the inactive-row visibility branch in the service method contract.
          status: REVIEW_REQUIRED
          evidence_refs:
            - fact_p23_simple_parameters
            - fact_p23_simple_customer_read
      risk_flags: []
      review_markers: []
      assumptions: []
    llm_evidence_expectation:
      evidence_type: LLM_INFERENCE
      accepted_without_review: false
    unsupported_claim_expectations: []
    trace_storage_expectations:
      model_invocation_summary_fields:
        - provider
        - model
        - model_profile_id
        - reasoning_effort
        - request_hash
        - prompt_hash
        - response_hash
        - input_token_count
        - output_token_count
        - total_token_count
        - latency_ms
        - status
      agent_run_summary_fields:
        - agent_run_id
        - job_id
        - runtime_version
        - prompt_ref
        - schema_ref
        - model_profile_id
        - validation_status
        - status
      expected_model_invocation:
        provider: fake-openai-compatible
        model: gpt-5-nano
        model_profile_id: openai_fast_test
      stored_prompt_text: false
      stored_procedure_definition_text: false
      stored_provider_response_text: false
    required_expected_outputs:
      business_rules_min: 1
      modernization_points_min: 1
      risk_flags_min: 0
      review_markers_min: 0
      conversion_guidance_min: 1
      migration_guide_insights_min: 1
