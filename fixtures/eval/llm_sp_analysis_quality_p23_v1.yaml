purpose: >
  P23B synthetic simple/medium/complex LLM-assisted stored procedure semantic
  analysis fixture suite. Each scenario separates deterministic metadata/static
  facts, transient SP definition model input, golden semantic output, and
  sanitized trace/storage expectations.
