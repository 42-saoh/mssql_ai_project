  options:
    llmProfileId: openai_fast_test
    useLlmAnalysis: false
    generateDtoDraft: true
    conversationMode: REFINE_CURRENT
referenceDesignRequest:
  dbProfileId: master
  message: 테이블 명은 PCO_사전감사야. 안에 들어가는 필드는 계약번호, 주문번호, 계약변경차수, 사전감사YN 야.
  designInputs:
    tableNameHint: dbo.PCS_CTRT, dbo.PEM_CTRT
  options:
    llmProfileId: openai_fast_test
    useLlmAnalysis: false
    generateDtoDraft: true
    conversationMode: NEW_DESIGN
expected:
