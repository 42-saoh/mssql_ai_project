scenario_id: metadata_design_natural_language_chat_p40_v1
description: Natural-language metadata design chat and multi-turn refinement.
newDesignRequest:
  dbProfileId: master
  message: 고객명, 주소, 주문일이 있는 주문 요청 테이블을 만들어줘.
  options:
    llmProfileId: openai_fast_test
    useLlmAnalysis: false
    generateDtoDraft: true
    conversationMode: NEW_DESIGN
refineRequest:
  dbProfileId: master
  message: 배송메모 추가하고, 주문일은 날짜 타입으로 바꿔줘.
