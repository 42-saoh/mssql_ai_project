version: productization_gap_closure_p18_v1
source_p17_fixture: fixtures/eval/live_pilot_blocker_closure_p17_v1.yaml
source_p16_fixture: fixtures/eval/pilot_release_readiness_p16_v1.yaml
source_canonical_candidate: fixtures/eval/canonical_analysis_candidate.json
source_pilot_manifest: fixtures/pilot/ppm_object_selection_v1/selected_objects.yaml
source_db: PPM
platform_db_context: PLF
current_state:
  p17_scoped_live_pilot_decision: CONDITIONAL_GO
  p17_scope: scoped_live_pilot_candidate_only
  p18_productization_decision: NO_GO
  production_ready: false
  p18_tracks:
    P18A:
      title: CanonicalAnalysisModel Contract Closure
      status: PLANNED
      release_blocker: CANONICAL_ANALYSIS_MODEL_REVIEW_REQUIRED
    P18B:
      title: Web HTTP Adapter And Auth/RBAC Evidence Closure
      status: PLANNED
      release_blocker: AUTH_RBAC_PRODUCTION_SOURCE_UNRESOLVED
policy_boundaries:
  metadata_only: true
  row_data_allowed: false
  procedure_execution_allowed: false
  raw_definition_text_allowed_in_evidence: false
  ddl_dml_allowed: false
  plf_fallback_allowed: false
  generated_artifacts_are_draft_only: true
  publish_or_export_allowed_without_approval: false
  production_ready_claim_allowed: false
p18a_canonical_analysis_model:
  current_candidate_contract: CanonicalAnalysisModel-compatible-local-v0.2
  target_contract: CanonicalAnalysisModel
  current_status: REVIEW_REQUIRED
  current_blockers:
    - DOMAIN_CONTRACT_MISSING
  observed_candidate_fields:
    - procedure.identifier
    - procedure.parameters
    - dependencies.table_references
    - dependencies.view_references
    - dependencies.function_references
    - dependencies.called_procedures
    - patterns.transaction
    - patterns.try_catch
    - patterns.dynamic_sql
    - patterns.temp_table
    - patterns.cursor
    - result_sets
    - call_graph
    - business_rules
    - evidence_assessment
    - overall_confidence
    - todos
    - review_markers
  exact_contract_blockers:
    - code: DOMAIN_CANONICAL_SCHEMA_MISSING
      target_path: packages/domain/src/ai_agent_domain/models.py
      required_resolution: Add an explicit versioned CanonicalAnalysisModel domain contract or keep productization NO_GO.
    - code: SNAPSHOT_ID_BINDING_MISSING
      target_path: packages/analysis/src/ai_agent_analysis/models.py
      required_resolution: Persist canonical snapshot id binding instead of source_name/source_hash only.
    - code: REGISTRY_VERSION_REFS_MISSING
      target_path: packages/analysis/src/ai_agent_analysis/models.py
      required_resolution: Persist registry version refs required by architecture readiness.
    - code: MODERNIZATION_POINTS_SCHEMA_MISSING
      target_path: packages/domain/src/ai_agent_domain/models.py
      required_resolution: Define modernization point shape or mark it REVIEW_REQUIRED with explicit evidence.
  release_critical_review_required_allowed: false
  uncertainty_policy:
    dynamic_sql_unresolved: REVIEW_REQUIRED
    incomplete_dependency_evidence: REVIEW_REQUIRED
    inferred_business_rule_without_evidence: REVIEW_REQUIRED
  exit_criteria:
    - release-critical canonical fields are observed or explicitly blocked
    - evidenceRefs exist for every observed release-critical field
    - no row data, procedure execution, or raw definition text is used
    - contract/eval tests cover required fields, status mapping, and forbidden evidence
p18b_web_http_auth_rbac:
  http_adapter:
    current_status: IMPLEMENTED_NOT_RELEASE_EVIDENCE
    default_mode: mock
    http_mode_env: PORTAL_API_MODE=http
    base_url_env: PORTAL_API_BASE_URL
    adapter_path: apps/web/lib/api/http-client.ts
    interface_path: apps/web/lib/api/portal-api.ts
    required_smoke_paths:
      - POST /api/v1/requests/sp-analysis
      - GET /api/v1/jobs/{jobId}
      - GET /api/v1/jobs/{jobId}/artifacts
      - GET /api/v1/artifacts/{artifactId}
      - POST /api/v1/artifacts/{artifactId}/validation
      - POST /api/v1/artifacts/{artifactId}/approval-decisions
      - GET /api/v1/metadata/db-profiles
      - GET /api/v1/metadata/search
      - GET /api/v1/registry/versions
    blocker_if:
      - WEB_HTTP_RELEASE_SMOKE_MISSING
      - HTTP_ADAPTER_DIVERGES_FROM_PORTAL_API_INTERFACE
      - UI_ACTION_IMPLIES_PUBLISH_EXPORT_OR_DEPLOY
  auth_rbac:
    current_status: BLOCKED
    blocker: AUTH_RBAC_PRODUCTION_SOURCE_UNRESOLVED
    must_not_fake_with_mock_headers: true
    required_resolution:
      - define production actor identity source
      - define role source and role-to-action matrix
      - enforce role checks in API/BFF routes or keep productization NO_GO
      - add negative tests for unauthorized validation and approval actions
  exit_criteria:
    - mock adapter remains available for demo/dev
    - HTTP adapter smoke proves the same PortalApi flow against local API routes
    - production auth/RBAC is implemented with tests or remains an explicit blocker
    - no publish/export, row data, procedure execution, DDL/DML, or PLF fallback path appears
active_productization_blockers:
  - code: CANONICAL_ANALYSIS_MODEL_REVIEW_REQUIRED
    owner_track: P18A
    severity: BLOCKER
  - code: DOMAIN_CANONICAL_SCHEMA_MISSING
    owner_track: P18A
    severity: BLOCKER
  - code: WEB_HTTP_RELEASE_SMOKE_MISSING
    owner_track: P18B
    severity: BLOCKER
  - code: AUTH_RBAC_PRODUCTION_SOURCE_UNRESOLVED
    owner_track: P18B
    severity: BLOCKER
p18_final_gate:
  allowed_decisions:
    - NO_GO
    - CONDITIONAL_GO
  current_productization_decision: NO_GO
  no_go_must_remain_when:
    - CanonicalAnalysisModel contract remains REVIEW_REQUIRED
    - HTTP adapter release smoke is missing
    - production auth/RBAC source is unresolved
    - any forbidden evidence or action is required
  p17_conditional_go_preserved: true
forbidden_evidence:
  - row_data
  - sample_rows
  - procedure_execution
  - sql_definition_text
  - committed_secret
  - auto_ddl_or_dml
  - plf_fallback_for_ppm
  - unapproved_publish_or_export
  - fake_auth_rbac_with_mock_headers
