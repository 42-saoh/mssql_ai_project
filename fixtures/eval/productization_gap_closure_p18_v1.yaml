p18b_web_http_auth_rbac:
  http_adapter:
    current_status: RELEASE_SMOKE_RECORDED
    default_mode: mock
    http_mode_env: PORTAL_API_MODE=http
    base_url_env: PORTAL_API_BASE_URL
    adapter_path: apps/web/lib/api/http-client.ts
    interface_path: apps/web/lib/api/portal-api.ts
    smoke_script_path: apps/web/scripts/http-adapter-smoke.mjs
    local_smoke_runner_path: tests/e2e/web_http_adapter_smoke.py
    smoke_command: pnpm --dir apps/web run smoke:http-adapter -- <baseUrl>
    local_smoke_command: python3 tests/e2e/web_http_adapter_smoke.py
    release_evidence_scope: local fixture-backed API route smoke only
    required_smoke_paths:
      - POST /api/v1/requests/sp-analysis
      - GET /api/v1/jobs/{jobId}
      - GET /api/v1/jobs/{jobId}/artifacts
      - GET /api/v1/artifacts/{artifactId}
      - POST /api/v1/artifacts/{artifactId}/validation
      - GET /api/v1/metadata/db-profiles
      - GET /api/v1/metadata/search
      - GET /api/v1/registry/versions
    blocker_if:
      - HTTP_ADAPTER_DIVERGES_FROM_PORTAL_API_INTERFACE
      - UI_ACTION_IMPLIES_PUBLISH_EXPORT_OR_DEPLOY
  auth_rbac:
    current_status: SOURCE_DOCUMENTED_ENFORCEMENT_IMPLEMENTED_LIVE_WIRING_DEFERRED
    documented_source:
      identity_source: verified OIDC/JWT from external IdP or API gateway
      role_source: PLF AUTH_USERS, AUTH_ROLES, AUTH_USER_ROLES
      source_doc: docs/admin-guide/auth-rbac-production-source.md
      adr: docs/adr/ADR-0006-production-auth-rbac-source.md
      canonical_roles:
        - USER
        - ADMIN
        - AUDITOR
    enforcement:
      enabled_by_env: AUTH_RBAC_ENFORCEMENT
      jwt_settings:
        - OIDC_ISSUER
        - OIDC_AUDIENCE
        - OIDC_JWKS_URL
      implemented_routes:
        - POST /api/v1/artifacts/{artifactId}/validation
      unauthorized_negative_tests: tests/integration/api/test_api_auth_rbac.py
      live_wiring_status: DEFERRED_OPTIONAL_FUTURE_HARDENING
    deferred_item: AUTH_RBAC_LIVE_IDP_PLF_WIRING_UNVERIFIED
    non_blocking_for_conditional_open: true
    must_not_fake_with_mock_headers: true
    future_hardening_resolution:
      - verify production OIDC/JWKS settings against an approved IdP
      - verify PLF AUTH_USERS/AUTH_ROLES/AUTH_USER_ROLES membership in an approved environment
  exit_criteria:
    - mock adapter remains available for demo/dev
    - HTTP adapter smoke proves the same PortalApi flow against local API routes
    - fixture-backed auth/RBAC enforcement remains covered while live wiring is documented as deferred
    - no publish/export, row data, procedure execution, DDL/DML, or PLF fallback path appears
active_productization_blockers: []
deferred_productization_items:
  - code: AUTH_RBAC_LIVE_IDP_PLF_WIRING_UNVERIFIED
