p18_final_gate:
  allowed_decisions:
    - NO_GO
    - CONDITIONAL_GO
  current_productization_decision: CONDITIONAL_GO
  no_go_must_remain_when:
    - HTTP adapter release smoke regresses or is missing
    - any forbidden evidence or action is required
  conditional_go_boundaries:
    - production_ready remains false
    - Auth/RBAC live IdP/JWKS and PLF wiring is deferred future hardening
    - fixture-backed 401/403 enforcement remains covered
  p17_conditional_go_preserved: true
