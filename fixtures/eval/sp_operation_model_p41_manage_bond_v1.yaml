fixture_suite_id: sp_operation_model_p41_manage_bond_v1
contract_ref: p41_sp_operation_model@0.1.0
phase: P41A
status: authored_p41a_groundwork
production_ready: false
purpose: >
  P41A fixture for PCO_GU_ManageBond_PRC. The fixture captures sanitized
  operation, statement, and DTO-blueprint expectations derived from the user's
  MIGRATION_GUIDE.md quality target without storing raw SP text or row data.

artifact_scope:
  requested_output_groups_unchanged:
    - JAVA_MYBATIS_DRAFT
  persisted_artifact_types_unchanged:
    - DTO_DRAFT
    - SERVICE_DRAFT
    - MAPPER_INTERFACE
    - MAPPER_XML
  dto_draft_internal_shape: multi_file_bundle_allowed
  new_public_artifact_type_allowed: false
  ui_change_allowed: false

source_reference:
  name: MIGRATION_GUIDE.md
  path_outside_repo: D:/migration/test_mcp_server_with_codex/MIGRATION_GUIDE.md
  target_ref: PPM.dbo.PCO_GU_ManageBond_PRC
  usage: sanitized_expectation_reference_only
  copy_reference_content_to_repo: false
  copy_raw_sp_text_to_repo: false

model_profiles:
  structured_operation_planner:
    profile_id: openai_sp_semantic_analysis
    default_model: gpt-5.5
    remote_gate_required: true
  fixture_test:
    profile_id: fake_gateway_fixture
    remote_gate_required: false

storage_policy:
  forbidden_payload_fields:
    - raw_prompt
    - raw_sp_definition
    - raw_openai_response_text
    - row_data
    - secrets
  forbidden_runtime_actions:
    - row_data_query
    - procedure_execution
    - business_db_ddl_or_dml
    - automatic_ddl_apply
    - automatic_generated_source_apply
    - ppm_to_plf_fallback

quality_thresholds:
  operation_crud_flag_coverage_min: 1.0
  dto_blueprint_min: 9
  statement_evidence_min: 10
  review_required_uncertain_items_min: 2
  current_generator_gap_must_be_visible: true
  forbidden_storage_findings_max: 0

operation_model:
  schemaVersion: SpOperationModel.v0.1
  contractTarget: SpOperationModel
  targetRef: PPM.dbo.PCO_GU_ManageBond_PRC
  sourcePolicy: sanitized_facts_only
  productionReady: false
  evidenceRefs:
    - ev_p41_manage_bond_guide
    - ev_p41_manage_bond_static_flow
  reviewMarkers:
    - SINGLE_DTO_COLLAPSE_REVIEW_REQUIRED
    - CROSS_DB_WRITE_REVIEW_REQUIRED
    - TVF_OR_PROCEDURE_KIND_REVIEW_REQUIRED
  assumptions:
    - User-provided guide is used as a quality target, not copied as source content.
    - Statement evidence is sanitized and does not contain executable SQL.
    - Called procedure input/output contracts require P41C metadata evidence.
  operations:
    - operationId: readBond
      crudFlag: R
      title: 보증정보 조회
      summary: General bond lookup with flag-specific joins and result shape variants.
      branchCondition:
        expression: "@CRUDFlag = 'R'"
        variables: ["@CRUDFlag", "@flag"]
        evidenceRefs: [ev_p41_manage_bond_call_flow]
        status: OBSERVED
      statementRefs:
        - stmt.read.pco_guar
        - stmt.read.advance_context
        - stmt.read.defect_context
      dtoBlueprintRefs:
        - ManageBondSearchCriteria
        - ManageBondSearchRow
      stateTransitions: []
      riskMarkers: [RESULT_SHAPE_BRANCH_VARIANT_REVIEW_REQUIRED]
      evidenceRefs: [ev_p41_manage_bond_call_flow]
      status: OBSERVED
    - operationId: approveBond
      crudFlag: A
      title: 보증승인
      summary: Approves the bond and updates advance or defect payment state by bond kind.
      branchCondition:
        expression: "@CRUDFlag = 'A' and @BondKindCode in ('020','030')"
        variables: ["@CRUDFlag", "@BondKindCode", "@ApprovalYN", "@Sequence"]
        evidenceRefs: [ev_p41_manage_bond_approve_phase]
        status: OBSERVED
      statementRefs:
        - stmt.approve.pco_guar
        - stmt.approve.advance_status
        - stmt.approve.erp_due_date
        - stmt.approve.finance_send
        - stmt.approve.defect_status
      dtoBlueprintRefs:
        - ApproveAdvanceBondCommand
        - ApproveDefectBondCommand
        - FinanceTransferCommand
      stateTransitions:
        - PCO_GUAR.GUAR_APRV_YN -> Y
        - PCO_GUAR.GUAR_ST_CD -> 060
        - PCS_ADVM_PAYRPT.ADVM_PRV_ST_CD -> 527/537
        - PCS_PAY_CMPD_RPT.PAY_CMPD_RPT_ST_CD -> 626/637
      riskMarkers: [CROSS_DB_WRITE_REVIEW_REQUIRED, TRANSACTION_BOUNDARY_REVIEW_REQUIRED]
      evidenceRefs: [ev_p41_manage_bond_approve_phase]
      status: OBSERVED
    - operationId: createBond
      crudFlag: C
      title: 보증정보 등록
      summary: Creates one PCO_GUAR row or a retention batch from split reserve values.
      branchCondition:
        expression: "@CRUDFlag = 'C' and @SValue controls single versus retention batch"
        variables: ["@CRUDFlag", "@BondKindCode", "@SValue"]
        evidenceRefs: [ev_p41_manage_bond_create_phase]
        status: OBSERVED
      statementRefs:
        - stmt.create.sequence
        - stmt.create.pco_guar.single
        - stmt.create.pco_guar.retention_batch
        - stmt.create.retention_update
      dtoBlueprintRefs:
        - CreateBondCommand
        - CreateRetentionBondBatchItem
      stateTransitions:
        - PCO_GUAR row inserted
        - Related payment report guarantee sequence updated by bond kind
      riskMarkers: [TVF_OR_PROCEDURE_KIND_REVIEW_REQUIRED]
      evidenceRefs: [ev_p41_manage_bond_create_phase]
      status: OBSERVED
    - operationId: updateBond
      crudFlag: U
      title: 보증정보 수정
      summary: Updates PCO_GUAR and optionally advance payment guarantee amount.
      branchCondition:
        expression: "@CRUDFlag = 'U'"
        variables: ["@CRUDFlag", "@BondKindCode", "@Sequence"]
        evidenceRefs: [ev_p41_manage_bond_update_phase]
        status: OBSERVED
      statementRefs:
        - stmt.update.pco_guar
        - stmt.update.advance_amount
      dtoBlueprintRefs:
        - UpdateBondCommand
      stateTransitions:
        - PCO_GUAR bond fields updated
      riskMarkers: []
      evidenceRefs: [ev_p41_manage_bond_update_phase]
      status: OBSERVED
    - operationId: deleteBond
      crudFlag: D
      title: 보증정보 삭제
      summary: Deletes attachment rows and PCO_GUAR, with retention cleanup for bond kind 040.
      branchCondition:
        expression: "@CRUDFlag = 'D'"
        variables: ["@CRUDFlag", "@BondKindCode", "@Sequence"]
        evidenceRefs: [ev_p41_manage_bond_delete_phase]
        status: OBSERVED
      statementRefs:
        - stmt.delete.attachment_detail
        - stmt.delete.attachment_master
        - stmt.delete.pco_guar
        - stmt.delete.retention_cleanup
      dtoBlueprintRefs:
        - DeleteBondCommand
      stateTransitions:
        - PCO_ATTC_FIL_DTL rows deleted
        - PCO_ATTC_FIL rows deleted
        - PCO_GUAR row deleted
        - PCS_RTNM_PAYRPT guarantee link cleared for retention
      riskMarkers: [CASCADE_DELETE_REVIEW_REQUIRED]
      evidenceRefs: [ev_p41_manage_bond_delete_phase]
      status: OBSERVED
    - operationId: updateVendorBond
      crudFlag: VENDOR_U
      title: 협력사 보증 업데이트
      summary: Updates advance or progress payment reports based on GUBUNFlag.
      branchCondition:
        expression: "@CRUDFlag = 'VENDOR_U' and @GUBUNFlag in ('J','G')"
        variables: ["@CRUDFlag", "@GUBUNFlag"]
        evidenceRefs: [ev_p41_manage_bond_vendor_phase]
        status: OBSERVED
      statementRefs:
        - stmt.vendor.advance_update
        - stmt.vendor.progress_update
      dtoBlueprintRefs:
        - VendorBondUpdateCommand
      stateTransitions:
        - Related payment report online/vendor guarantee fields updated
      riskMarkers: [GUBUN_BRANCH_CONTRACT_REVIEW_REQUIRED]
      evidenceRefs: [ev_p41_manage_bond_vendor_phase]
      status: OBSERVED
    - operationId: updateOnlineBond
      crudFlag: ONLINE_U
      title: 온라인 보증 업데이트
      summary: Updates online bond fields for advance or progress payment reports.
      branchCondition:
        expression: "@CRUDFlag = 'ONLINE_U' and @GUBUNFlag in ('J','G')"
        variables: ["@CRUDFlag", "@GUBUNFlag"]
        evidenceRefs: [ev_p41_manage_bond_online_phase]
        status: OBSERVED
      statementRefs:
        - stmt.online.advance_update
        - stmt.online.progress_update
      dtoBlueprintRefs:
        - OnlineBondUpdateCommand
      stateTransitions:
        - Online guarantee fields updated by payment report type
      riskMarkers: [GUBUN_BRANCH_CONTRACT_REVIEW_REQUIRED]
      evidenceRefs: [ev_p41_manage_bond_online_phase]
      status: OBSERVED
  statementEvidence:
    - statementId: stmt.read.pco_guar
      operation: SELECT
      targetRef: PPM.dbo.PCO_GUAR
      phase: read_bond
      inputs: ["@ContractNum", "@OrdNum", "@BondKindCode", "@Sequence", "@flag"]
