fixture_suite_id: sp_migration_guide_quality_p24_v1
contract_ref: p24_sp_migration_guide_quality@0.3.0
phase: P24
status: authored_p24b
production_ready: false
purpose: >
  P24B synthetic simple/medium/complex fixture suite for stored procedure
  migration guide quality. The suite stores sanitized facts and guide
  expectations only; procedure source text and user-provided guide text are
  outside the persisted fixture boundary.
model_profiles:
  guide_generation:
    profile_id: openai_sp_semantic_analysis
    default_model: gpt-5.5
  fast_test:
    profile_id: openai_fast_test
    default_model: gpt-5-nano
    override_env: OPENAI_MODEL_FAST_TEST
artifact_scope:
  existing_artifact_types:
    - SP_ANALYSIS_DOC
    - DEPENDENCY_REPORT
  new_persisted_artifact_types_allowed: false
  java_mybatis_output_policy: draft_only_readiness_notes
input_policy:
  source_kind: synthetic_contract_fixture
  guide_source_policy: sanitized_facts_only
  copy_reference_content_to_repo: false
  copy_raw_sp_text_to_repo: false
safety_expectations:
  forbidden_payload_fields:
    - raw_prompt
    - raw_sp_definition
    - raw_openai_response_text
    - row_data
    - secrets
  forbidden_runtime_actions:
    - row_data_query
    - procedure_execution
    - business_db_ddl_or_dml
    - automatic_artifact_apply
    - automatic_deployment
    - ppm_to_plf_fallback
report_contract:
  fields:
    - status
    - productionReady
    - scores
    - thresholds
    - evidenceRefs
    - sectionCoverage
    - reviewRequiredFindings
    - storageSafetyFindings
reference_quality_expectations:
  heading_policy: korean_titles_with_stable_section_anchors
  stable_section_anchor_format: "<!-- section:{section_id} -->"
  internal_section_ids_visible_as_headings: false
  required_rendered_elements:
    - overview_table
    - feature_branch_taxonomy_table
    - confirmed_dependency_table
    - needs_verification_dependency_table
    - table_level_dml_matrix
    - branch_call_flow
    - critical_phase_table
    - complexity_metric_table
    - manual_metadata_query_appendix
    - evidence_and_review_marker_list
  llm_insight_boundary: LLM_INFERENCE_REVIEW_REQUIRED
quality_thresholds:
  required_section_coverage_min: 1.0
  evidence_linked_claim_coverage_min: 0.9
  dml_matrix_coverage_min: 0.9
  branch_call_flow_coverage_min: 0.85
  unsupported_claim_review_required_ratio_min: 1.0
  forbidden_storage_findings_max: 0
scenarios:
  - fixture_id: p24_simple_read_only_lookup
