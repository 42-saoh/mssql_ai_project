    phase_risk_metrics:
      complexity_score: 1
      branch_count: 2
      dml_operation_count: 1
      complexity_metrics:
        - metric: LOC
          count: 24
          evidence_rule: Non-empty sanitized source line count.
          notes: ""
          evidence_refs:
            - ev_p24_simple_static_flow
        - metric: DYNAMIC_SQL_SIGNAL
          count: 0
          evidence_rule: sp_executesql/EXEC dynamic scan.
          notes: ""
          evidence_refs:
            - ev_p24_simple_static_flow
      risk_flags:
        - code: LOW_EVIDENCE_LABEL_MEANING
          status: REVIEW_REQUIRED
          severity: INFO
          evidence_refs:
            - ev_p24_simple_status_table
    appendix_mappings:
      parameters:
        - name: ShipmentId
          sanitized_type: int
          evidence_refs:
            - ev_p24_simple_proc
        - name: IncludeArchived
          sanitized_type: bit
          evidence_refs:
            - ev_p24_simple_proc
      result_fields:
        - name: StatusCode
          evidence_refs:
            - ev_p24_simple_static_flow
        - name: StatusLabel
          evidence_refs:
            - ev_p24_simple_status_table
    metadata_extraction_appendix: &p24_metadata_extraction_appendix
      policy: Metadata-only evidence aid; do not execute procedures, select row data, apply DDL/DML, or paste raw definitions.
      queries:
        - id: definition_hash_length
          title: SP definition hash/length
          sql: SELECT HASHBYTES('SHA2_256', CONVERT(varbinary(max), sm.definition)) AS definition_sha256, DATALENGTH(sm.definition) AS definition_bytes FROM sys.sql_modules sm WHERE sm.object_id = OBJECT_ID(@FullName);
          result_template: "| definition_sha256 | definition_bytes | status |"
        - id: parameters
          title: Procedure parameters
          sql: SELECT p.parameter_id, p.name, TYPE_NAME(p.user_type_id) AS data_type, p.is_output FROM sys.parameters p WHERE p.object_id = OBJECT_ID(@FullName);
          result_template: "| parameter_id | name | data_type | is_output | status |"
        - id: static_dependencies
          title: Static catalog dependencies
          sql: SELECT referenced_database_name, referenced_schema_name, referenced_entity_name, is_caller_dependent, is_ambiguous FROM sys.sql_expression_dependencies WHERE referencing_id = OBJECT_ID(@FullName);
          result_template: "| database | schema | entity | caller_dependent | ambiguous | status |"
        - id: referenced_entities
          title: Referenced entities DMV
          sql: SELECT referenced_schema_name, referenced_entity_name, referenced_class_desc, is_selected, is_updated FROM sys.dm_sql_referenced_entities(@FullName, N'OBJECT');
          result_template: "| schema | entity | class | selected | updated | status |"
        - id: dynamic_sql_indicators
          title: Dynamic SQL and external reference indicators
          sql: SELECT CASE WHEN sm.definition LIKE '%sp_executesql%' THEN 1 ELSE 0 END AS has_sp_executesql, CASE WHEN sm.definition LIKE '%OPENQUERY%' THEN 1 ELSE 0 END AS has_openquery FROM sys.sql_modules sm WHERE sm.object_id = OBJECT_ID(@FullName);
          result_template: "| has_sp_executesql | has_openquery | status | what_to_extract_next |"
        - id: temp_table_review
          title: Temp table/table variable evidence caveats
          sql: SELECT CASE WHEN sm.definition LIKE '%CREATE TABLE #%' THEN 1 ELSE 0 END AS has_temp_table, CASE WHEN sm.definition LIKE '%DECLARE @% TABLE%' THEN 1 ELSE 0 END AS has_table_variable FROM sys.sql_modules sm WHERE sm.object_id = OBJECT_ID(@FullName);
          result_template: "| has_temp_table | has_table_variable | status | what_to_extract_next |"
      paste_templates:
        - "| Type | Name | How referenced | Evidence | Notes |"
        - "| Type | Name/Candidate | Why uncertain | What to extract next | Notes |"
    unsupported_claim_expectations:
      - obligation: low_evidence_business_rule_claims
        claim_type: business_rule
        claim_code: LOW_EVIDENCE_LABEL_MEANING
        expected_status: REVIEW_REQUIRED
        evidence_refs:
          - ev_p24_simple_status_table
