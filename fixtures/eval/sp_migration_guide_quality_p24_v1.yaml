        storageSafetyFindings: 0
      thresholds:
        requiredSectionCoverageMin: 1.0
        evidenceLinkedClaimCoverageMin: 0.9
        dmlMatrixCoverageMin: 0.9
        branchCallFlowCoverageMin: 0.85
        unsupportedClaimReviewRequiredRatioMin: 1.0
        forbiddenStorageFindingsMax: 0
      evidenceRefs:
        - ev_p24_simple_proc
        - ev_p24_simple_static_flow
      sectionCoverage:
        sp_overview: true
        feature_branch_taxonomy: true
        dependency_inventory: true
        dml_impact_matrix: true
        call_flow: true
        critical_phase_analysis: true
        complexity_risk_metrics: true
        migration_strategy: true
        appendix_mappings: true
        metadata_extraction_appendix: true
        evidence_assumptions_review: true
