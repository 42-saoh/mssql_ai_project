    fixture_authoring_status: authored_p24b
    target_ref: PPM.dbo.usp_P24LookupShipmentStatus
    db_context:
      metadata_profile_id: ppm
      target_db: PPM
      platform_db: PLF
      plf_fallback: forbidden
    artifacts_under_test:
      - SP_ANALYSIS_DOC
      - DEPENDENCY_REPORT
    evidence_refs:
      - id: ev_p24_simple_proc
        type: MSSQL_METADATA
        object_ref: PPM.dbo.usp_P24LookupShipmentStatus
        locator: p24.simple.metadata.procedure
      - id: ev_p24_simple_shipment_table
        type: MSSQL_METADATA
