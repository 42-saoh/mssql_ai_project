version: productization_readiness_v1
source_manifest: fixtures/pilot/ppm_object_selection_v1/selected_objects.yaml
mode_policy:
  live_metadata:
    can_reference_selected_object_identities: true
    must_preserve_active_blockers: true
    readiness_label: optional_live_metadata_evidence
  template_only:
    can_reference_selected_object_identities: false
    must_preserve_active_blockers: true
    readiness_label: blocker_dependent_template
forbidden_evidence:
  - row_data
  - procedure_execution
  - sql_definition_text
  - committed_secret
  - auto_ddl_or_dml
  - plf_fallback_for_ppm
current_manifest_expectations:
  selection_version: ppm_object_selection_v1
  source_db: PPM
  platform_db_context: PLF
  allowed_selection_modes:
    - template_only
    - live_metadata
  active_blockers_to_carry_forward: []
  closed_blockers:
    - DEPENDENCY_METADATA_INCOMPLETE
milestones:
  P09:
    readiness_gate: api_workflow_uses_ppm_object_ids_only_when_live_metadata
    verification:
      - make test PYTEST_ARGS="tests/integration/api tests/unit/api"
    blocker_if:
      - shared_contract_change_required
      - ppm_manifest_template_only_but_live_fixture_requested
  P10:
    readiness_gate: mcp_metadata_evidence_remains_read_only_and_caveated
    verification:
      - make test PYTEST_ARGS="tests/contract/mcp tests/unit/mcp tests/unit/test_mcp_catalog.py tests/unit/test_mssql_mcp_live_config.py tests/contract/test_local_mssql_connection_assets.py"
    blocker_if:
      - ppm_metadata_permission_missing
      - row_data_or_procedure_execution_required
  P11:
    readiness_gate: sp_analysis_marks_incomplete_dependencies_as_evidence_caveats
    verification:
      - make test PYTEST_ARGS="tests/unit/analysis"
    blocker_if:
      - canonical_contract_change_required
      - dependency_metadata_incomplete_but_confirmed_link_required
  P12:
    readiness_gate: generated_artifacts_are_draft_only_with_evidence_and_quality_caveats
    verification:
      - make test PYTEST_ARGS="tests/unit/generation tests/contract/test_generation_goldens_and_repro_assets.py"
    blocker_if:
      - generation_policy_change_required
      - generated_source_auto_apply_requested
  P13:
    readiness_gate: validation_audit_blocks_publish_from_draft
    verification:
      - make test PYTEST_ARGS="tests/unit/validation tests/unit/api tests/integration/api"
    blocker_if:
      - db_schema_change_required
      - publish_from_draft_possible
  P14:
    readiness_gate: web_demo_shows_draft_evidence_caveat_and_blocker_states
    verification:
      - make test-web-smoke
    blocker_if:
      - lockfile_or_dependency_change_required
      - ui_would_trigger_publish_or_db_mutation
  P15:
    readiness_gate: eval_ops_metrics_distinguish_fixture_optional_live_and_blocker_modes
    verification:
      - make test PYTEST_ARGS="tests/e2e tests/eval"
    blocker_if:
      - live_ppm_eval_required_without_access
      - security_or_observability_contract_change_required
  P16:
    readiness_gate: release_readiness_includes_go_no_go_and_handoff_evidence
    verification:
      - make test PYTEST_ARGS="tests/e2e tests/eval tests/contract"
    blocker_if:
      - ppm_manifest_template_only
      - active_blockers_unresolved_for_live_release
      - policy_forbidden_action_required
  P17:
    readiness_gate: scoped_live_pilot_conditional_go_requires_closed_blockers
    verification:
      - make test PYTEST_ARGS="tests/e2e tests/eval tests/contract"
      - P15_HARD_LIVE_GATE=1 MSSQL_ENABLE_LIVE_METADATA=1 make test PYTEST_ARGS="tests/e2e tests/eval tests/contract"
    blocker_if:
      - live_pilot_artifact_validation_not_passed
      - validation_audit_binding_missing
      - hard_live_gate_not_reproducible
  P18:
    readiness_gate: productization_gaps_require_canonical_contract_and_http_auth_evidence
    verification:
      - make test PYTEST_ARGS="tests/unit/analysis tests/eval tests/contract"
      - make test PYTEST_ARGS="tests/integration/api tests/e2e tests/eval"
      - make test-web-smoke
    blocker_if:
      - canonical_analysis_model_evidence_caveated
      - web_http_release_smoke_missing
      - auth_rbac_production_source_unresolved
