version: validation_approval_audit_p13_v1
source_manifest: fixtures/pilot/ppm_object_selection_v1/selected_objects.yaml
selection_mode: live_metadata
profile_policy:
  analysis_db_profile_id: ppm
  source_database: PPM
  platform_db_context: PLF
  plf_fallback_allowed: false
active_blockers: []
closed_blockers:
  - DEPENDENCY_METADATA_INCOMPLETE
public_api_contract:
  draft_quality_caveats_exposed_as_response_fields: true
  audit_events_exposed_as_response_fields: false
  validation_shape_uses_existing_fields:
    - checks
    - missingEvidence
    - qualityCaveats
storage_contract:
  decision_records_present: false
  validation_summary_location: ARTIFACT_VALIDATION_REPORTS
  audit_trace_location: AUDIT_EVENTS.TRC_ID
  schema_change_required: false
forbidden_evidence:
  - row_data
  - procedure_execution
  - sql_definition_text
  - committed_secret
  - auto_ddl_or_dml
  - plf_fallback_for_ppm
  - unvalidated_publish_or_export
sample_scenarios:
  - sample_id: p13-validation-evidence-audit-simple-procedure
    readiness_label: optional_live_metadata_evidence
    request:
      dbProfileId: ppm
      target:
        type: PROCEDURE
        schema: dbo
        name: GetInspItemsCd
      outputs:
        - SP_ANALYSIS_DOCUMENT
        - DEPENDENCY_REPORT
      options:
        includeEvidenceRefs: true
    expected:
      job_status: VALIDATION_COMPLETE
      current_step: VALIDATE
      validation_report:
        required_check_fields:
          - ruleId
          - severity
          - result
        required_report_fields:
          - artifactId
          - status
          - checks
          - missingEvidence
          - qualityCaveats
      draft_quality_gate:
        validation_report_binding: latest_validation_report_id
        checklist_items:
          - validation.latest_report_persisted
          - validation.status_passed_or_caveated
          - validation.no_failed_checks
          - evidence.no_missing_refs
          - caveats.quality_caveats_visible
      audit_event_shape:
        required_fields:
          - stage
          - actor
          - targetRef
          - correlationId
          - refs
        expected_stages:
          - REQUEST
          - JOB
          - METADATA
          - ARTIFACT
          - VALIDATION
      forbidden_artifact_statuses:
        - PUBLISHED
      forbidden_actions:
        - publish_from_draft
        - export_from_unvalidated_draft
