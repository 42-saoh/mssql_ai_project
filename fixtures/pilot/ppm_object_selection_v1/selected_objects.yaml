blocker_candidates:
  - code: PPM_DB_NOT_FOUND
    when: sys.databases lookup cannot find database name PPM on the configured local SQL Server instance.
  - code: PPM_DB_ACCESS_DENIED
    when: the metadata user cannot access the PPM database catalog.
  - code: METADATA_READ_ONLY_PERMISSION_INSUFFICIENT
    when: sys catalog views required for object, column, dependency, index, constraint, or extended-property discovery are denied.
  - code: SP_DEFINITION_ACCESS_DENIED
    when: sys.sql_modules.definition or equivalent procedure definition metadata cannot be read.
  - code: DEPENDENCY_METADATA_INCOMPLETE
    when: dependency metadata is unavailable or too incomplete to justify representative object selection.
  - code: PPM_PLF_ROLE_CONFLICT
    when: project files or local configuration imply PPM and PLF roles differently from PPM=pilot target and PLF=platform DB.
  - code: LIVE_METADATA_UNAVAILABLE
    when: live MSSQL connection cannot be established from the worker environment.
  - code: MIN_METADATA_DISCOVERY_SURFACE_INSUFFICIENT
    when: P08A cannot secure enough metadata-only inventory evidence without expanding into P10 product hardening scope.
