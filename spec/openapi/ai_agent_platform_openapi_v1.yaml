openapi: 3.1.0
info:
  title: MSSQL Analysis Agent Platform API
  version: 0.1.0
  summary: OpenAPI contract skeleton for the MSSQL analysis, documentation, and Java/MyBatis draft-generation platform.
  description: |
    Starter API contract for the central Agent platform that analyzes MSSQL Stored Procedures
    and related database metadata, produces documentation, and creates draft Java/MyBatis
    conversion artifacts.

    This contract is intentionally skeleton-level. It defines the stable API surface and
    response shapes expected by the first implementation wave while preserving project
    policies:

    - metadata access is read-only and routed through the MSSQL Metadata MCP boundary;
    - generated documentation, Java/MyBatis code, DTO/VO/Model, and DDL are draft artifacts;
    - publish-like actions require validation evidence and human approval;
    - live row-data queries, automatic DDL execution, and unreviewed code application are out of scope.
servers:
  - url: http://localhost:{port}
    description: Local API/BFF server
    variables:
      port:
        default: "8000"
        description: APP_PORT resolved by Makefile or scripts/resolve_dev_ports.sh.
tags:
  - name: health
    description: Service health endpoints.
  - name: requests
    description: Work request submission endpoints.
  - name: jobs
    description: Workflow job status endpoints.
  - name: artifacts
    description: Draft artifact preview and validation endpoints.
  - name: approvals
    description: Human review and approval endpoints.
  - name: registry
    description: Prompt, template, profile, and policy registry endpoints.
  - name: metadata
    description: Read-only metadata profile and MCP catalog endpoints.
paths:
  /health:
    get:
      tags: [health]
      summary: Check API service health.
      operationId: getHealth
      responses:
        "200":
          description: API service is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    service: api
                    version: 0.1.0
  /api/v1/requests/sp-analysis:
    post:
      tags: [requests]
      summary: Submit an MSSQL Stored Procedure analysis request.
      operationId: createStoredProcedureAnalysisRequest
      description: |
        Starts a draft-only analysis workflow for one stored procedure. The resulting job is
        expected to collect metadata through the MCP boundary, build a canonical analysis
        model, generate requested artifacts, and stop at validation/review gates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SPAnalysisRequest"
            examples:
              spWrapper:
                value:
                  dbProfileId: plf
                  target:
                    type: PROCEDURE
                    schema: dbo
                    name: usp_OrderRequest_Select
                  outputs:
                    - SP_ANALYSIS_DOCUMENT
                    - DEPENDENCY_REPORT
                    - JAVA_MYBATIS_DRAFT
                  options:
                    includeModernizationHints: true
                    includeEvidenceRefs: true
      responses:
        "202":
          description: Request accepted and workflow job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Read workflow job status.
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/artifacts:
    get:
      tags: [artifacts]
      summary: List draft artifacts created by a job.
      operationId: listJobArtifacts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Draft artifacts for the job.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, artifacts]
                properties:
                  jobId:
                    type: string
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtifactSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: Preview a generated draft artifact.
      operationId: getArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Draft artifact content and evidence references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}/validation:
    post:
      tags: [artifacts]
      summary: Validate a draft artifact before review or approval.
      operationId: validateArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Validation report for the artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}/approval-decisions:
    post:
      tags: [approvals]
      summary: Record a human approval decision for a draft artifact.
      operationId: createApprovalDecision
      description: |
        Records a reviewer decision. This endpoint only records review state; it does not
        deploy code, execute DDL, or mutate MSSQL business data.
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "201":
          description: Approval decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/metadata/db-profiles:
    get:
      tags: [metadata]
      summary: List available MSSQL metadata profiles.
      operationId: listMetadataProfiles
      description: Returns safe profile metadata only; secrets and connection strings are never returned.
      responses:
        "200":
          description: Metadata profile list.
          content:
            application/json:
              schema:
                type: object
                required: [defaultProfileId, profiles]
                properties:
                  defaultProfileId:
                    type: string
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetadataProfile"
  /api/v1/metadata/tools:
    get:
      tags: [metadata]
      summary: List read-only MSSQL Metadata MCP tools exposed to the Agent platform.
      operationId: listMetadataTools
      responses:
        "200":
          description: MCP tool catalog summary.
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetadataToolSummary"
  /api/v1/registry/versions:
    get:
      tags: [registry]
      summary: List active registry version bindings used by generation workflows.
      operationId: listRegistryVersions
      responses:
        "200":
          description: Registry version bindings.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistryVersion"
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      example: job_demo_001
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
      example: art_demo_001
  responses:
    BadRequest:
      description: Invalid request payload or unsupported workflow option.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    TargetObject:
      type: object
      required: [type, schema, name]
      properties:
        type:
          type: string
          enum: [PROCEDURE, TABLE, VIEW, FUNCTION]
        schema:
          type: string
          examples: [dbo]
        name:
          type: string
          examples: [usp_OrderRequest_Select]
    SPAnalysisRequest:
      type: object
      required: [dbProfileId, target, outputs]
      properties:
        dbProfileId:
          type: string
          description: Metadata profile identifier, for example plf or master.
        target:
          $ref: "#/components/schemas/TargetObject"
        outputs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RequestedOutputType"
        options:
          type: object
          additionalProperties:
            type: boolean
    SubmitRequestResponse:
      type: object
      required: [requestId, jobId, status]
      properties:
        requestId:
          type: string
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        echo:
          type: object
          description: Optional starter implementation echo of the normalized request.
    Job:
      type: object
      required: [jobId, requestId, status]
      properties:
        jobId:
          type: string
        requestId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        currentStep:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStepType"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum:
        - SUBMITTED
        - COLLECTING_METADATA
        - ANALYZING
        - GENERATING
        - VALIDATING
        - REVIEW_PENDING
        - APPROVED
        - REJECTED
        - PUBLISHED
        - FAILED
        - CANCELED
    WorkflowStepType:
      type: string
      enum:
        - COLLECT_METADATA
        - ANALYZE
        - GENERATE
        - VALIDATE
        - REVIEW
        - PUBLISH
    ArtifactSummary:
      type: object
      required: [artifactId, type, status]
      properties:
        artifactId:
          type: string
        type:
          $ref: "#/components/schemas/ArtifactType"
        status:
          $ref: "#/components/schemas/ArtifactStatus"
        title:
          type: string
        evidenceCoverage:
          type: number
          minimum: 0
          maximum: 1
    Artifact:
      allOf:
        - $ref: "#/components/schemas/ArtifactSummary"
        - type: object
          required: [content, evidenceRefs, generatorVersion, registryRefs]
          properties:
            content:
              type: string
              description: Draft artifact body or serialized file manifest.
            evidenceRefs:
              type: array
              items:
                $ref: "#/components/schemas/EvidenceRef"
            generatorVersion:
              type: string
            registryRefs:
              type: array
              items:
                type: string
            assumptions:
              type: array
              items:
                type: string
            reviewRequired:
              type: boolean
              default: true
    ArtifactType:
      type: string
      description: Persisted draft artifact type. Request output groups map to one or more of these values.
      enum:
        - SP_ANALYSIS_DOC
        - DEPENDENCY_REPORT
        - METADATA_QUERY_RESULT
        - SCHEMA_ENRICHMENT_RESULT
        - MAPPER_XML
        - MAPPER_INTERFACE
        - SERVICE_DRAFT
        - DTO_DRAFT
        - VO_DRAFT
        - MODEL_DRAFT
        - DDL_DRAFT
        - VALIDATION_REPORT
        - APPROVAL_LOG
    RequestedOutputType:
      type: string
      description: User-facing output group requested at submission time.
      enum:
        - SP_ANALYSIS_DOCUMENT
        - DEPENDENCY_REPORT
        - TABLE_COLUMN_METADATA
        - JAVA_MYBATIS_DRAFT
        - DTO_MODEL_DRAFT
        - DDL_DRAFT
    ArtifactStatus:
      type: string
      enum:
        - DRAFT
        - VALIDATED
        - REVIEW_PENDING
        - APPROVED
        - REJECTED
        - PUBLISHED
        - ARCHIVED
    EvidenceRef:
      type: object
      required: [type, objectRef, locator]
      properties:
        type:
          type: string
          enum: [MSSQL_METADATA, STATIC_ANALYSIS, POLICY, TEMPLATE, USER_INPUT]
        objectRef:
          type: string
          examples: [plf.dbo.usp_OrderRequest_Select]
        locator:
          type: string
        snapshotId:
          type: string
    ValidationReport:
      type: object
      required: [artifactId, status, checks]
      properties:
        artifactId:
          type: string
        status:
          type: string
          enum: [PASSED, FAILED, REVIEW_REQUIRED]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"
        missingEvidence:
          type: array
          items:
            type: string
        manualReviewPoints:
          type: array
          items:
            type: string
    ValidationCheck:
      type: object
      required: [ruleId, severity, result]
      properties:
        ruleId:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, ERROR, BLOCKER]
        result:
          type: string
          enum: [PASS, FAIL, REVIEW_REQUIRED]
        message:
          type: string
    ApprovalDecisionRequest:
      type: object
      required: [decision, reviewer, comment]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, REQUEST_CHANGES]
        reviewer:
          type: string
        comment:
          type: string
        validationReportId:
          type: string
    ApprovalRecord:
      type: object
      required: [approvalId, artifactId, decision, reviewer, decidedAt]
      properties:
        approvalId:
          type: string
        artifactId:
          type: string
        decision:
          type: string
          enum: [APPROVE, REJECT, REQUEST_CHANGES]
        reviewer:
          type: string
        comment:
          type: string
        decidedAt:
          type: string
          format: date-time
    MetadataProfile:
      type: object
      required: [id, database, readOnly]
      properties:
        id:
          type: string
        database:
          type: string
        description:
          type: string
        readOnly:
          type: boolean
          const: true
    MetadataToolSummary:
      type: object
      required: [name, description, readOnly]
      properties:
        name:
          type: string
        description:
          type: string
        readOnly:
          type: boolean
          const: true
    RegistryVersion:
      type: object
      required: [registryType, version]
      properties:
        registryType:
          type: string
          enum: [PROMPT, TEMPLATE, POLICY, DB_PROFILE, GENERATOR]
        version:
          type: string
        active:
          type: boolean
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        code:
          type: string
