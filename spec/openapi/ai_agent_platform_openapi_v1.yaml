          minimum: 0
        evidenceFactCount:
          type: integer
          minimum: 0
        citedEvidenceFactCount:
          type: integer
          minimum: 0
        evidenceUtilization:
          type: number
          minimum: 0
          maximum: 1
        claimCount:
