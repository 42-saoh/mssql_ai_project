        modelProfileId:
          type: string
        modelRegistryRef:
          type: string
        reasoningEffort:
          type: string
        promptVersion:
          type: string
        outputSchemaVersion:
          type: string
        inputHash:
          type: string
        promptHash:
          type: string
        outputHash:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, FAILED, SKIPPED]
