openapi: 3.1.0
info:
  title: MSSQL Analysis Agent Platform API
  version: 0.1.0
  summary: OpenAPI contract skeleton for the MSSQL analysis, documentation, and Java/MyBatis draft-generation platform.
  description: |
    Starter API contract for the central Agent platform that analyzes MSSQL Stored Procedures
    and related database metadata, produces documentation, and creates draft Java/MyBatis
    conversion artifacts.

    This contract is intentionally skeleton-level. It defines the stable API surface and
    response shapes expected by the first implementation wave while preserving project
    policies:

    - metadata access is read-only and routed through the MSSQL Metadata MCP boundary;
    - generated documentation and Java/MyBatis DTO/Service/Mapper drafts are draft artifacts;
    - worker-facing analysis text is Korean (ko-KR), while JSON keys, enum/status/code values,
      artifact types, rule ids, section ids, evidence refs, and SQL/Java identifiers remain the
      stable English machine contract;
    - workflows stop at validation-complete draft output without user review or approval flows;
    - live row-data queries, automatic DDL execution, and unvalidated code application are out of scope.
servers:
  - url: http://localhost:{port}
    description: Local API/BFF server
    variables:
      port:
        default: "8000"
        description: APP_PORT resolved by Makefile or scripts/resolve_dev_ports.sh.
tags:
  - name: health
    description: Service health endpoints.
  - name: requests
    description: Work request submission endpoints.
  - name: jobs
    description: Workflow job status endpoints.
  - name: artifacts
    description: Draft artifact preview and validation endpoints.
  - name: registry
    description: Prompt, template, profile, and policy registry endpoints.
  - name: metadata
    description: Read-only metadata profile and MCP catalog endpoints.
  - name: knowledge
    description: Versioned sanitized knowledge assets, fact graph, and export endpoints.
paths:
  /health:
    get:
      tags: [health]
      summary: Check API service health.
      operationId: getHealth
      responses:
        "200":
          description: API service is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    service: api
                    version: 0.1.0
  /api/v1/requests/sp-analysis:
    post:
      tags: [requests]
      summary: Submit an MSSQL Stored Procedure analysis request.
      operationId: createStoredProcedureAnalysisRequest
      description: |
        Starts a draft-only analysis workflow for one stored procedure. The resulting job is
        expected to collect metadata through the MCP boundary, build a canonical analysis
        model, generate requested artifacts, and stop at the validation-complete draft gate.
        By default the workflow completes before the response is returned. Web clients can
        opt into immediate navigation by setting runAsync=true and polling the returned job.
      parameters:
        - name: runAsync
          in: query
          required: false
          description: When true, the API returns after job creation and runs the SP workflow in a background task.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SPAnalysisRequest"
            examples:
              spWrapper:
                value:
                  dbProfileId: plf
                  target:
                    type: PROCEDURE
                    schema: dbo
                    name: usp_OrderRequest_Select
                  outputs:
                    - SP_ANALYSIS_DOCUMENT
                    - DEPENDENCY_REPORT
                    - JAVA_MYBATIS_DRAFT
                  options:
                    includeModernizationHints: true
                    includeEvidenceRefs: true
                    useAiToolOrchestration: true
      responses:
        "202":
          description: Request accepted and workflow job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/Backpressure"
  /api/v1/requests/sp-analysis/batch:
    post:
      tags: [requests]
      summary: Submit a bounded batch of MSSQL Stored Procedure analysis requests.
      operationId: createStoredProcedureAnalysisBatch
      description: |
        Accepts a bounded list of stored procedure targets and creates normal workflow jobs
        for each accepted target. Duplicate targets in the same batch are skipped. The API
        does not create a persisted batch table and returns only sanitized grouping metadata,
        accepted job ids, rejected target codes, and active limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SPAnalysisBatchRequest"
      responses:
        "202":
          description: Batch accepted with per-target accepted/rejected summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SPAnalysisBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/Backpressure"
  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List recent workflow jobs with optional request context for history views.
      operationId: listJobs
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: targetKey
          in: query
          required: false
          schema:
            type: string
          description: Exact canonical target key filter.
      responses:
        "200":
          description: Recent workflow jobs with target/profile/output context when available.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
  /api/v1/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Read workflow job status and request context.
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/agent-runs:
    get:
      tags: [jobs]
      summary: List sanitized agent runtime traces for a job.
      operationId: listJobAgentRuns
      description: |
        Returns model and agent trace summaries only. Raw prompt text, SP definition text,
        and raw model response text are not exposed by this endpoint.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Sanitized agent run traces for the job.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, agentRuns]
                properties:
                  jobId:
                    type: string
                  agentRuns:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentRunSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/knowledge-assets:
    get:
      tags: [jobs, knowledge]
      summary: List versioned knowledge assets created by a job.
      operationId: listJobKnowledgeAssets
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Sanitized knowledge assets for the job.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, knowledgeAssets]
                properties:
                  jobId:
                    type: string
                  knowledgeAssets:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeAssetSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/jobs/{jobId}/artifacts:
    get:
      tags: [artifacts]
      summary: List draft artifacts created by a job.
      operationId: listJobArtifacts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Draft artifacts for the job.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, artifacts]
                properties:
                  jobId:
                    type: string
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtifactSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: Preview a generated draft artifact.
      operationId: getArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Draft artifact content and evidence references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}/validation:
    post:
      tags: [artifacts]
      summary: Validate a draft artifact quality gate.
      operationId: validateArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Validation report for the artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/artifacts/{artifactId}/validation/latest:
    get:
      tags: [artifacts]
      summary: Read the latest validation report without creating a validation write.
      operationId: getLatestValidationReport
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Latest validation report for the artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/metadata/db-profiles:
    get:
      tags: [metadata]
      summary: List available MSSQL metadata profiles.
      operationId: listMetadataProfiles
      description: Returns safe profile metadata only; secrets and connection strings are never returned.
      responses:
        "200":
          description: Metadata profile list.
          content:
            application/json:
              schema:
                type: object
                required: [defaultProfileId, profiles]
                properties:
                  defaultProfileId:
                    type: string
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetadataProfile"
  /api/v1/metadata/tools:
    get:
      tags: [metadata]
      summary: List read-only MSSQL Metadata MCP tools exposed to the Agent platform.
      operationId: listMetadataTools
      responses:
        "200":
          description: MCP tool catalog summary.
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetadataToolSummary"
  /api/v1/metadata/tools/{toolName}/invoke:
    post:
      tags: [metadata]
      summary: Invoke a public read-only MSSQL Metadata MCP dependency evidence tool.
      operationId: invokeMetadataTool
      description: |
        Invokes only the public P28 dependency-evidence allowlist through the MSSQL Metadata
        MCP registry boundary: get_dependency_closure and resolve_dependency_reference.
        The request accepts a structured arguments object only. The response is a sanitized
        metadata envelope with snapshot and evidence refs; it never returns row data, executes
        stored procedures, exposes SQL definition text, stores raw metadata, performs DDL/DML,
        or falls back from PPM to PLF.
      parameters:
        - name: toolName
          in: path
          required: true
          schema:
            type: string
            enum:
              - get_dependency_closure
              - resolve_dependency_reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataToolInvokeRequest"
      responses:
        "200":
          description: Sanitized metadata tool invocation envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataToolInvokeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/DependencyBlocked"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/metadata/analyze:
    post:
      tags: [metadata]
      summary: Analyze read-only MSSQL metadata with bounded AI-MCP orchestration.
      operationId: analyzeMetadata
      description: |
        Runs response-only metadata analysis. The API first builds deterministic metadata
        identity context from a query or target, then allows the LLM to plan bounded
        active/read-only MCP metadata tool calls. Tool execution stays internal to the API
        registry boundary; the public metadata tool invocation allowlist is not expanded.
        Responses contain sanitized evidence digests, deterministic fact ids, LLM insights,
        machine caveat markers and caveats. They never include row data, raw SQL definition text,
        procedure execution output, DDL/DML controls, secrets, or raw provider traces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataAnalysisRequest"
      responses:
        "200":
          description: Response-only metadata analysis with sanitized AI-MCP evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/DependencyBlocked"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/metadata/analysis-runs:
    post:
      tags: [metadata]
      summary: Submit an asynchronous metadata analysis run.
      operationId: submitMetadataAnalysisRun
      description: |
        Starts a durable platform metadata analysis run and returns a run id for polling.
        The run executes the same sanitized, read-only analysis as `POST /api/v1/metadata/analyze`
        using the manual-apply v7 `METADATA_ANALYSIS_RUNS` storage contract. Submit/poll returns
        `503 METADATA_ANALYSIS_RUN_SCHEMA_REQUIRED` when that table, required columns, or indexes
        are missing. Polling results never include row data, raw SQL definition text, procedure
        execution output, DDL/DML controls, secrets, raw prompts, or raw provider traces.
        A background recovery worker claims `QUEUED` runs and reclaims stale `RUNNING`
        runs for retry so interrupted background work does not leave users waiting
        indefinitely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataAnalysisRequest"
      responses:
        "202":
          description: Metadata analysis run was accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataAnalysisRunStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/DependencyBlocked"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/metadata/analysis-runs/{runId}:
    get:
      tags: [metadata]
      summary: Poll an asynchronous metadata analysis run.
      operationId: getMetadataAnalysisRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current metadata analysis run status, result, or failure payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataAnalysisRunStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/metadata/design-runs:
    post:
      tags: [metadata]
      summary: Submit an asynchronous metadata design chat run.
      operationId: submitMetadataDesignRun
      description: |
        Starts a durable metadata design chat run. The run accepts a natural-language
        message, optional conversation mode, intentMode, API-compatible field inputs,
        searchInputs, and table hints. AUTO or SEARCH_ONLY search intent returns
        read-only metadata search results and optional TABLE schema candidates; table
        design intent returns sanitized interpreted intent, applied changes,
        evidence-bound table script, and DTO previews.
        The v10 `METADATA_DESIGN_RUNS` schema is manual-apply only. Results never
        include row data, raw SQL/SP definitions, procedure execution output,
        secrets, raw prompts, raw provider traces, apply controls, or workflow
        artifact persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataDesignRunRequest"
      responses:
        "202":
          description: Metadata design run was accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDesignRunStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/DependencyBlocked"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/metadata/design-runs/{runId}:
    get:
      tags: [metadata]
      summary: Poll an asynchronous metadata design chat run.
      operationId: getMetadataDesignRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current metadata design run status, result, or failure payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDesignRunStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/metadata/design-conversations/{conversationId}:
    get:
      tags: [metadata]
      summary: List metadata design runs in one conversation.
      operationId: getMetadataDesignConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metadata design conversation runs in reverse chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDesignConversation"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Backpressure"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/knowledge/assets:
    get:
      tags: [knowledge]
      summary: Search draft knowledge assets.
      operationId: listKnowledgeAssets
      parameters:
        - name: assetKind
          in: query
          schema:
            type: string
        - name: dbProfileId
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetSchema
          in: query
          schema:
            type: string
        - name: targetName
          in: query
          schema:
            type: string
        - name: lifecycleStatus
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeLifecycleStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Matching knowledge assets.
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeAssetSummary"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/knowledge/facts/search:
    get:
      tags: [knowledge]
      summary: Search facts across draft knowledge asset versions.
      operationId: searchKnowledgeFacts
      parameters:
        - name: objectRef
          in: query
          schema:
            type: string
        - name: factType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [OBSERVED, INFERRED_DESCRIPTION, REVIEW_REQUIRED]
        - name: assetKind
          in: query
          schema:
            type: string
        - name: targetName
          in: query
          schema:
            type: string
        - name: lifecycleStatus
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeLifecycleStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Matching knowledge facts.
          content:
            application/json:
              schema:
                type: object
                required: [facts]
                properties:
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeFactSearchResult"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/knowledge/assets/{assetId}:
    get:
      tags: [knowledge]
      summary: Read a versioned knowledge asset summary.
      operationId: getKnowledgeAsset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized knowledge asset summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeAssetSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/knowledge/assets/{assetId}/versions:
    get:
      tags: [knowledge]
      summary: List versions for a knowledge asset.
      operationId: listKnowledgeAssetVersions
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Knowledge asset versions.
          content:
            application/json:
              schema:
                type: object
                required: [assetId, versions]
                properties:
                  assetId:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeAssetVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/knowledge/assets/{assetId}/versions/{versionId}/facts:
    get:
      tags: [knowledge]
      summary: List sanitized facts and edges for one knowledge asset version.
      operationId: listKnowledgeVersionFacts
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized fact graph for one version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFactGraph"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/knowledge/exports:
    post:
      tags: [knowledge]
      summary: Export selected knowledge asset versions.
      operationId: createKnowledgeExport
      description: |
        Exports sanitized facts only. v1 supports JSONL and GRAPH_JSON. Raw SP definitions,
        raw SQL text, row data, secrets, raw prompts, and raw provider responses are never
        included in export content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeExportRequest"
      responses:
        "200":
          description: Knowledge export content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExportResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/DependencyBlocked"
  /api/v1/registry/versions:
    get:
      tags: [registry]
      summary: List active registry version bindings used by generation workflows.
      operationId: listRegistryVersions
      responses:
        "200":
          description: Registry version bindings.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistryVersion"
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      example: job_123
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
      example: art_123
  responses:
    BadRequest:
      description: Invalid request payload or unsupported workflow option.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The requested read-only metadata dependency is blocked by policy or access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyBlocked:
      description: Required metadata dependency is unavailable or blocked by policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Backpressure:
      description: Workflow or metadata tool capacity is temporarily exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    TargetObject:
      type: object
      required: [type, schema, name]
      properties:
        type:
          type: string
          enum: [PROCEDURE, TABLE, VIEW, FUNCTION]
        schema:
          type: string
          minLength: 1
          examples: [dbo]
        name:
          type: string
          minLength: 1
          examples: [usp_OrderRequest_Select]
    SPAnalysisRequest:
      type: object
      required: [dbProfileId, target, outputs]
      properties:
        dbProfileId:
          type: string
          minLength: 1
          description: Metadata profile identifier, for example plf or master.
        target:
          $ref: "#/components/schemas/TargetObject"
        outputs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RequestedOutputType"
        options:
          $ref: "#/components/schemas/SPAnalysisOptions"
    SPAnalysisBatchRequest:
      type: object
      required: [dbProfileId, targets, outputs]
      properties:
        dbProfileId:
          type: string
          minLength: 1
          description: Metadata profile identifier, for example plf, ppm, or master.
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TargetObject"
        outputs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RequestedOutputType"
        options:
          $ref: "#/components/schemas/SPAnalysisOptions"
    SPAnalysisOptions:
      type: object
      properties:
        includeEvidenceRefs:
          type: boolean
          default: true
        includeModernizationHints:
          type: boolean
          default: true
        useLlmAnalysis:
          type: boolean
          default: true
        llmProfileId:
          type: string
          default: openai_sp_semantic_analysis
          enum:
            - openai_sp_semantic_analysis
            - openai_fast_test
        allowSpDefinitionToModel:
          type: boolean
          default: true
          description: Backward-compatible gate for transient source context. When true, sourceContextMode defaults to RETRIEVED_SPANS rather than sending the full procedure definition.
        sourceContextMode:
          type: string
          default: RETRIEVED_SPANS
          enum:
            - NONE
            - RETRIEVED_SPANS
          description: Controls whether bounded retrieved SP spans can be used as transient model input. Stored responses include only sanitized coverage summaries.
        sourceDependencyMode:
          type: string
          default: CONFIRMED_PROCEDURES
          enum:
            - NONE
            - CONFIRMED_PROCEDURES
          description: Controls whether confirmed same-profile dependency procedures receive bounded transient source-context semantic child analysis.
        useAiToolOrchestration:
          type: boolean
          default: true
        usePlatformToolOrchestration:
          type: boolean
          default: true
        persistKnowledge:
          type: boolean
          default: true
    SubmitRequestResponse:
      type: object
      required: [requestId, jobId, status]
      properties:
        requestId:
          type: string
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        echo:
          type: object
          description: Optional starter implementation echo of the normalized request.
    SPAnalysisBatchAcceptedItem:
      type: object
      required: [target, requestId, jobId, status]
      properties:
        target:
          $ref: "#/components/schemas/TargetObject"
        requestId:
          type: string
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
    SPAnalysisBatchRejectedItem:
      type: object
      required: [target, code, message]
      properties:
        target:
          $ref: "#/components/schemas/TargetObject"
        code:
          type: string
          enum:
            - BATCH_TARGET_LIMIT_EXCEEDED
            - DUPLICATE_TARGET_SKIPPED
            - WORKFLOW_BACKPRESSURE
            - BAD_REQUEST
        message:
          type: string
    SPAnalysisBatchResponse:
      type: object
      required: [batchId, status, accepted, rejected, limits]
      properties:
        batchId:
          type: string
        status:
          type: string
          enum: [ACCEPTED, PARTIAL, REJECTED]
        accepted:
          type: array
          items:
            $ref: "#/components/schemas/SPAnalysisBatchAcceptedItem"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/SPAnalysisBatchRejectedItem"
        limits:
          type: object
          additionalProperties:
            type: integer
    Job:
      type: object
      required: [jobId, requestId, status]
      properties:
        jobId:
          type: string
        requestId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        dbProfileId:
          type: string
          description: Metadata profile requested for this analysis job when available.
        target:
          $ref: "#/components/schemas/TargetObject"
        targetKey:
          type: string
          description: Server-derived canonical target key for exact same-target history.
        outputs:
          type: array
          description: Requested draft output groups for this analysis job when available.
          items:
            $ref: "#/components/schemas/RequestedOutputType"
        currentStep:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStepType"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Estimated status-based progress for UI visibility; not exact work completion.
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchBlocker"
        caveats:
          type: array
          items:
            type: string
        failureReason:
          type: string
    JobStatus:
      type: string
      description: VALIDATION_COMPLETE is the terminal draft status after validation.
      enum:
        - SUBMITTED
        - COLLECTING_METADATA
        - ANALYZING
        - GENERATING
        - VALIDATING
        - VALIDATION_COMPLETE
        - FAILED
        - CANCELED
    WorkflowStepType:
      type: string
      enum:
        - COLLECT_METADATA
        - ANALYZE
        - GENERATE
        - VALIDATE
    ArtifactSummary:
      type: object
      required: [artifactId, type, status]
      properties:
        artifactId:
          type: string
        jobId:
          type: string
        type:
          $ref: "#/components/schemas/ArtifactType"
        status:
          $ref: "#/components/schemas/ArtifactStatus"
        title:
          type: string
        targetKey:
          type: string
          description: Canonical target key inherited from the workflow job.
        evidenceCoverage:
          type: number
          minimum: 0
          maximum: 1
    Artifact:
      allOf:
        - $ref: "#/components/schemas/ArtifactSummary"
        - type: object
          required: [content, evidenceRefs, generatorVersion, registryRefs]
          properties:
            content:
              type: string
              description: Draft artifact body or serialized file manifest.
            evidenceRefs:
              type: array
              items:
                $ref: "#/components/schemas/EvidenceRef"
            generatorVersion:
              type: string
            registryRefs:
              type: array
              items:
                type: string
            assumptions:
              type: array
              items:
                type: string
            reviewRequired:
              type: boolean
              default: true
              description: Machine uncertainty/evidence caveat flag; not a decision request.
    ArtifactType:
      type: string
      description: Persisted draft artifact type. Request output groups map to one or more of these values.
      enum:
        - SP_ANALYSIS_DOC
        - DEPENDENCY_REPORT
        - METADATA_QUERY_RESULT
        - SCHEMA_ENRICHMENT_RESULT
        - MAPPER_XML
        - MAPPER_INTERFACE
        - SERVICE_DRAFT
        - DTO_DRAFT
        - VALIDATION_REPORT
    RequestedOutputType:
      type: string
      description: User-facing output group requested at submission time.
      enum:
        - SP_ANALYSIS_DOCUMENT
        - DEPENDENCY_REPORT
        - TABLE_COLUMN_METADATA
        - JAVA_MYBATIS_DRAFT
    ArtifactStatus:
      type: string
      enum:
        - DRAFT
        - VALIDATED
        - ARCHIVED
    EvidenceRef:
      type: object
      required: [type, objectRef, locator]
      properties:
        type:
          type: string
          enum: [MSSQL_METADATA, STATIC_ANALYSIS, LLM_INFERENCE, POLICY, TEMPLATE, USER_INPUT]
        objectRef:
          type: string
          examples: [plf.dbo.usp_OrderRequest_Select]
        locator:
          type: string
        snapshotId:
          type: string
    ValidationReport:
      type: object
      required: [artifactId, status, checks]
      properties:
        validationReportId:
          type: string
        artifactId:
          type: string
        status:
          type: string
          enum: [PASSED, FAILED, REVIEW_REQUIRED]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"
        missingEvidence:
          type: array
          items:
            type: string
        qualityCaveats:
          type: array
          description: Evidence and draft-quality caveats surfaced by validation.
          items:
            type: string
    ValidationCheck:
      type: object
      required: [ruleId, severity, result]
      properties:
        ruleId:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, ERROR, BLOCKER]
        result:
          type: string
          enum: [PASS, FAIL, REVIEW_REQUIRED]
        message:
          type: string
    ModelInvocationSummary:
      type: object
      required:
        - provider
        - model
        - modelProfileId
        - promptVersion
        - outputSchemaVersion
        - inputHash
        - promptHash
        - outputHash
        - status
      properties:
        provider:
          type: string
        model:
          type: string
        modelProfileId:
          type: string
        modelRegistryRef:
          type: string
        reasoningEffort:
          type: string
        promptVersion:
          type: string
        outputSchemaVersion:
          type: string
        inputHash:
          type: string
        promptHash:
          type: string
        outputHash:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, FAILED, SKIPPED]
        tokenUsage:
          type: object
          additionalProperties:
            type: integer
        latencyMs:
          type: integer
        analysisCoverage:
          type: object
          description: Sanitized source-map coverage summary; never includes raw SP text or snippets.
          additionalProperties: true
        sourceContextSummary:
          type: object
          description: Sanitized retrieved-span context summary; never includes raw SP text, snippets, prompt body, row data, or provider response text.
          additionalProperties: true
        componentInvocations:
          type: array
          description: Sanitized per-stage model invocation and internal read-only tool summaries.
          items:
            type: object
            additionalProperties: true
    AgentRunSummary:
      type: object
      required:
        - agentRunId
        - jobId
        - agentType
        - status
        - targetRef
        - summary
        - structuredOutput
        - modelInvocation
      properties:
        agentRunId:
          type: string
        jobId:
          type: string
        agentType:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, FAILED, SKIPPED]
        targetRef:
          type: string
        targetKey:
          type: string
          description: Canonical target key when the run is bound to a root or dependency target.
        summary:
          type: string
        structuredOutput:
          type: object
          additionalProperties: true
        modelInvocation:
          $ref: "#/components/schemas/ModelInvocationSummary"
        createdAt:
          type: string
          format: date-time
    MetadataProfile:
      type: object
      required: [id, database, readOnly]
      properties:
        id:
          type: string
        database:
          type: string
        description:
          type: string
        readOnly:
          type: boolean
          const: true
    MetadataToolSummary:
      type: object
      required: [name, description, readOnly, invokable]
      properties:
        name:
          type: string
        description:
          type: string
        readOnly:
          type: boolean
          const: true
        invokable:
          type: boolean
          description: True only for public API invocation allowlisted metadata tools.
    MetadataToolInvokeRequest:
      type: object
      required: [arguments]
      additionalProperties: false
      properties:
        arguments:
          type: object
          additionalProperties: true
          description: Structured MCP tool arguments only; free-form SQL/write command keys are rejected.
    MetadataToolInvokeResponse:
      type: object
      required: [ok, toolName, dbProfileId, snapshotId, collectedAt, evidenceRefs, data]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        toolName:
          type: string
          enum:
            - get_dependency_closure
            - resolve_dependency_reference
        dbProfileId:
          type: string
        snapshotId:
          type: string
        collectedAt:
          type: string
          format: date-time
        evidenceRefs:
          type: array
          items:
            type: object
            additionalProperties: true
        data:
          type: object
          additionalProperties: true
    MetadataSearchObjectType:
      type: string
      enum: [PROCEDURE, TABLE, VIEW, FUNCTION]
    MetadataObjectIdentity:
      type: object
      required: [schema, name, type]
      properties:
        schema:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/MetadataSearchObjectType"
    MetadataSearchBlocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples:
            - PPM_MANIFEST_TEMPLATE_ONLY
            - METADATA_SEARCH_MCP_TOOL_MISSING
            - PPM_DB_NOT_FOUND
            - PPM_DB_ACCESS_DENIED
            - LIVE_METADATA_UNAVAILABLE
            - DEPENDENCY_METADATA_INCOMPLETE
            - P21_LIVE_PPM_REQUIRED
        message:
          type: string
    MetadataSearchResult:
      type: object
      required:
        - objectIdentity
        - sourceProfile
        - sourceDatabase
        - evidenceRefs
        - caveats
        - reviewRequired
        - blockers
      properties:
        objectIdentity:
          $ref: "#/components/schemas/MetadataObjectIdentity"
        targetKey:
          type: string
          description: Canonical target key for this metadata object identity.
        sourceProfile:
          type: string
        sourceDatabase:
          type: string
        snapshotId:
          type: string
        evidenceRefs:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRef"
        caveats:
          type: array
          items:
            type: string
        reviewRequired:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchBlocker"
    MetadataSearchResponse:
      type: object
      required:
        - dbProfileId
        - query
        - objectTypes
        - limit
        - sourceProfile
        - sourceDatabase
        - results
        - caveats
        - reviewRequired
        - blockers
      properties:
        dbProfileId:
          type: string
        query:
          type: string
        objectTypes:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchObjectType"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        sourceProfile:
          type: string
        sourceDatabase:
          type: string
        snapshotId:
          type: string
        collectedAt:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchResult"
        caveats:
          type: array
          items:
            type: string
        reviewRequired:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchBlocker"
    MetadataAnalysisOptions:
      type: object
      properties:
        useLlmAnalysis:
          type: boolean
          default: true
        useAiToolOrchestration:
          type: boolean
          default: true
        llmProfileId:
          type: string
          default: openai_sp_semantic_analysis
          enum:
            - openai_sp_semantic_analysis
            - openai_fast_test
        maxTargets:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        persistKnowledge:
          type: boolean
          default: true
        generateDtoDrafts:
          type: boolean
          default: false
    MetadataAnalysisRequest:
      type: object
      required: [dbProfileId]
      description: Provide exactly one of query or target.
      properties:
        dbProfileId:
          type: string
        query:
          type: string
          minLength: 1
        target:
          $ref: "#/components/schemas/MetadataObjectIdentity"
        objectTypes:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchObjectType"
          default: [PROCEDURE, TABLE, VIEW, FUNCTION]
        options:
          $ref: "#/components/schemas/MetadataAnalysisOptions"
    MetadataAnalysisRunError:
      type: object
      required: [code, message, statusCode]
      properties:
        code:
          type: string
        message:
          type: string
        statusCode:
          type: integer
    MetadataAnalysisRunStatus:
      type: object
      required:
        - runId
        - status
        - submittedAt
        - request
      properties:
        runId:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
        submittedAt:
          type: string
          format: date-time
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        request:
          $ref: "#/components/schemas/MetadataAnalysisRequest"
        analysis:
          oneOf:
            - $ref: "#/components/schemas/MetadataAnalysisResponse"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/MetadataAnalysisRunError"
            - type: "null"
    MetadataDesignFieldInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        dbType:
          type: string
        nullable:
          type: boolean
    MetadataDesignInputs:
      type: object
      properties:
        tableNameHint:
          type: string
        tableDescription:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MetadataDesignFieldInput"
          default: []
    MetadataDesignSearchInputs:
      type: object
      properties:
        query:
          type: string
        objectTypes:
          type: array
          items:
            $ref: "#/components/schemas/MetadataSearchObjectType"
          default: [PROCEDURE, TABLE, VIEW, FUNCTION]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        includeTableSchema:
          type: boolean
          default: true
    MetadataDesignOptions:
      type: object
      properties:
        useLlmAnalysis:
          type: boolean
          default: true
        useAiToolOrchestration:
          type: boolean
          default: true
        llmProfileId:
          type: string
          default: openai_sp_semantic_analysis
          enum:
            - openai_sp_semantic_analysis
            - openai_fast_test
        maxCandidates:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        generateDtoDraft:
          type: boolean
          default: true
        conversationMode:
          type: string
          enum:
            - NEW_DESIGN
            - REFINE_CURRENT
          default: NEW_DESIGN
        intentMode:
          type: string
          enum:
            - AUTO
            - SEARCH_ONLY
            - DESIGN_TABLE
          default: AUTO
    MetadataDesignRunRequest:
      type: object
      required: [dbProfileId, message]
      properties:
        dbProfileId:
          type: string
        message:
          type: string
          minLength: 1
          maxLength: 4000
        conversationId:
          type: string
        designInputs:
          $ref: "#/components/schemas/MetadataDesignInputs"
        searchInputs:
          $ref: "#/components/schemas/MetadataDesignSearchInputs"
        options:
          $ref: "#/components/schemas/MetadataDesignOptions"
    MetadataRelatedMetadata:
      type: object
      required: [kind, objectRef, score, summary, evidenceRefs, payload]
      properties:
        kind:
          type: string
          enum: [TABLE, COLUMN, SIMILAR_TABLE, TABLE_SCHEMA]
        objectRef:
          type: string
        score:
          type: integer
        summary:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
        payload:
          type: object
          additionalProperties: true
    MetadataStandardizationMapping:
      type: object
      required:
        - proposedName
        - proposedType
        - source
        - evidenceRefs
        - reviewRequired
        - reviewReasons
      properties:
        inputName:
          type: string
        inputDescription:
          type: string
        proposedName:
          type: string
        proposedType:
          type: string
        source:
          type: string
          enum: [METADATA, STANDARD_POLICY, REVIEW_REQUIRED]
        evidenceRefs:
          type: array
          items:
            type: string
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
    MetadataTableProposalColumn:
      type: object
      required:
        - name
        - dataType
        - nullable
        - source
        - evidenceRefs
        - reviewRequired
        - reviewReasons
      properties:
        name:
          type: string
        dataType:
          type: string
        nullable:
          type: boolean
        description:
          type: string
        source:
          type: string
          enum: [METADATA, STANDARD_POLICY, USER_INPUT, REVIEW_REQUIRED]
        evidenceRefs:
          type: array
          items:
            type: string
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
    MetadataTableProposal:
      type: object
      required:
        - schema
        - tableName
        - columns
        - createTableScriptPreview
        - evidenceRefs
        - reviewRequired
        - reviewReasons
      properties:
        schema:
          type: string
          default: dbo
        tableName:
          type: string
        tableDescription:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/MetadataTableProposalColumn"
        createTableScriptPreview:
          type: string
          description: Non-executable table script preview for manual schema review.
        evidenceRefs:
          type: array
          items:
            type: string
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
    MetadataDesignIntentChange:
      type: object
      required:
        - action
        - summary
        - reviewRequired
        - reviewReasons
      properties:
        action:
          type: string
          enum:
            - ADD_FIELD
            - REMOVE_FIELD
            - RENAME_FIELD
            - CHANGE_TYPE
            - CHANGE_NULLABILITY
            - SET_TABLE_NAME
            - SET_TABLE_DESCRIPTION
            - REVIEW_REQUIRED
        target:
          type: string
        value:
          type: string
        summary:
          type: string
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
    MetadataDesignInterpretedIntent:
      type: object
      required:
        - intent
        - fields
        - modifications
        - confidence
        - reviewRequired
        - reviewReasons
      properties:
        intent:
          type: string
          enum:
            - CREATE_TABLE
            - REFINE_TABLE
            - SEARCH_METADATA
            - UNKNOWN
        tableNameCandidate:
          type: string
        tableDescription:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MetadataDesignFieldInput"
        modifications:
          type: array
          items:
            $ref: "#/components/schemas/MetadataDesignIntentChange"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
    MetadataDesignAppliedChange:
      type: object
      required:
        - action
        - summary
        - reviewRequired
        - reviewReasons
      properties:
        action:
          type: string
        target:
          type: string
        summary:
          type: string
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
    MetadataDesignResult:
      type: object
      required:
        - resultKind
        - assistantMessage
        - interpretedIntent
        - appliedChanges
        - relatedMetadata
        - standardizationMappings
        - aiToolEvidence
        - deterministicFacts
        - reviewMarkers
        - caveats
        - reviewRequired
        - componentInvocations
      properties:
        resultKind:
          type: string
          enum:
            - SEARCH_RESULT
            - DESIGN_PROPOSAL
          default: DESIGN_PROPOSAL
        assistantMessage:
          type: string
        interpretedIntent:
          $ref: "#/components/schemas/MetadataDesignInterpretedIntent"
        appliedChanges:
          type: array
          items:
