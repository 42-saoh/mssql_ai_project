        - SP_ANALYSIS_DOCUMENT
        - DEPENDENCY_REPORT
        - TABLE_COLUMN_METADATA
        - JAVA_MYBATIS_DRAFT
        - DTO_MODEL_DRAFT
        - DDL_DRAFT
