        - DEPENDENCY_REPORT
        - METADATA_QUERY_RESULT
        - SCHEMA_ENRICHMENT_RESULT
        - MAPPER_XML
        - MAPPER_INTERFACE
        - SERVICE_DRAFT
        - DTO_DRAFT
        - VO_DRAFT
        - MODEL_DRAFT
        - DDL_DRAFT
        - VALIDATION_REPORT
        - APPROVAL_LOG
