version: 0.1.0
service: mssqlMetadata
readOnly: true
response:
  standardData:
    required: [sourceProfile, sourceDatabase, objectIdentity, caveats, reviewRequired]
    properties:
      sourceProfile: { type: string }
      sourceDatabase: { type: string }
      objectIdentity:
        type: object
        required: [database, name, objectType]
        properties:
          database: { type: string }
          schema: { type: string }
          name: { type: string }
          objectType: { type: string }
      caveats:
        type: array
        items: { type: string }
      reviewRequired: { type: boolean }
  dependencyItem:
    type: object
    required:
      - objectType
      - database
      - server
      - schema
      - name
      - referencedDatabase
      - referencedServer
      - sourceScope
      - dependencyType
      - isAmbiguous
      - reviewStatus
      - resolutionStatus
      - resolutionStrategy
      - evidenceRefs
    properties:
      objectType:
        type: string
        description: TABLE, VIEW, FUNCTION, PROCEDURE, SYNONYM, or UNKNOWN.
      database:
        type: string
        nullable: true
        description: Confirmed catalog database for the dependency object when known.
      server:
        type: string
        nullable: true
        description: Confirmed catalog server for the dependency object when known; null for same-server metadata.
      schema:
        type: string
        nullable: true
      name:
        type: string
        nullable: true
      referencedDatabase:
        type: string
        nullable: true
        description: Database name recorded by sys.sql_expression_dependencies, when present.
      referencedServer:
        type: string
        nullable: true
        description: Server name recorded by sys.sql_expression_dependencies, when present.
      sourceScope:
        type: string
        nullable: true
        description: SAME_DATABASE or SAME_SERVER_CROSS_DATABASE for catalog-confirmable metadata scopes; null for dynamic or cross-server review items.
      dependencyType:
        type: string
        description: Metadata-only dependency type; defaults to REFERENCE unless deterministic catalog evidence supports a stronger type.
      isAmbiguous: { type: boolean }
      reviewStatus:
        type: string
        enum: [CONFIRMED, REVIEW_REQUIRED]
      resolutionStatus:
        type: string
        enum: [CONFIRMED, REVIEW_REQUIRED]
      resolutionStrategy:
        type: string
        description: Deterministic catalog resolution strategy or review-required reason.
      resolutionConfidence:
        type: string
        enum: [HIGH, MEDIUM, LOW, UNKNOWN]
        description: Catalog-evidence confidence for deterministic dependency resolution; unknown or low confidence must not be promoted as a deterministic fact.
      resolutionEvidenceKind:
        type: string
        enum: [CATALOG_OBJECT_ID, EXPRESSION_DEPENDENCY, SYNONYM_METADATA, NAME_MATCH_CANDIDATE, DYNAMIC_SQL_MARKER, UNRESOLVED]
        description: Metadata-only evidence class used to resolve or hold the dependency.
      unresolvedReason:
        type: string
        nullable: true
        description: Safe reason for unresolved or review-required dependency evidence, without raw SQL definition text.
      resolutionChain:
        type: array
        description: Metadata-only resolution steps, for example expression dependency -> synonym metadata -> candidate object.
        items:
          type: object
          required: [step, evidenceKind, status]
          properties:
            step: { type: string }
            evidenceKind: { type: string }
            status: { type: string }
            evidenceRefs:
              type: array
              items:
                type: object
                required: [id, source, path]
                properties:
                  id: { type: string }
                  source: { type: string }
                  path: { type: string }
                  objectType: { type: string }
                  objectName: { type: string }
      evidenceRefs:
        type: array
        items:
          type: object
          required: [id, source, path]
          properties:
            id: { type: string }
            source: { type: string }
            path: { type: string }
            objectType: { type: string }
            objectName: { type: string }
  success:
    required: [ok, toolName, dbProfileId, snapshotId, collectedAt, evidenceRefs, data]
    properties:
      ok: { type: boolean }
      toolName: { type: string }
      dbProfileId: { type: string }
      snapshotId: { type: string }
      collectedAt: { type: string, format: date-time }
      evidenceRefs:
        type: array
        items:
          type: object
          required: [id, source, path]
          properties:
            id: { type: string }
            source: { type: string }
            path: { type: string }
            objectType: { type: string }
            objectName: { type: string }
      data: { type: object }
  error:
    required: [ok, toolName, error]
    properties:
      ok: { type: boolean }
      toolName: { type: string }
      dbProfileId: { type: string }
      snapshotId: { type: string }
      collectedAt: { type: string, format: date-time }
      evidenceRefs:
        type: array
        items: { type: object }
      error:
        type: object
        required: [code, message]
        properties:
          code: { type: string }
          message: { type: string }
          details:
            type: object
            description: Safe diagnostic fields only; never SQL text, credentials, row data, or connection strings.
            properties:
              toolName: { type: string }
              dbProfileId: { type: string }
              database: { type: string }
              missingSettingsCount: { type: integer }
              timeoutSeconds: { type: integer }
              attempt: { type: integer }
              errorClass: { type: string }
errorCodes:
  - UNKNOWN_TOOL
  - INVALID_ARGUMENTS
  - PROFILE_NOT_FOUND
  - OBJECT_NOT_FOUND
  - READ_ONLY_VIOLATION
  - LIVE_METADATA_UNAVAILABLE
  - PPM_DB_NOT_FOUND
  - PPM_DB_ACCESS_DENIED
  - METADATA_READ_ONLY_PERMISSION_INSUFFICIENT
  - SP_DEFINITION_ACCESS_DENIED
  - DEPENDENCY_METADATA_INCOMPLETE
  - INTERNAL_ERROR
tools:
  - name: check_database_exists
    active: true
    readOnly: true
    description: Return database existence and catalog accessibility metadata. Non-master profiles may only probe their configured database.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        databaseName: { type: string }

  - name: list_procedures
    active: true
    readOnly: true
    description: Return procedure inventory metadata for object selection, including definition availability/hash metadata but not definition text.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        topK: { type: integer, default: 100 }

  - name: list_tables
    active: true
    readOnly: true
    description: Return table inventory metadata for object selection.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        topK: { type: integer, default: 100 }

  - name: list_views
    active: true
    readOnly: true
    description: Return view identity and definition availability/hash metadata without definition text.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        topK: { type: integer, default: 100 }

  - name: list_functions
    active: true
    readOnly: true
    description: Return function identity and definition availability/hash metadata without definition text.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        topK: { type: integer, default: 100 }

  - name: search_metadata_objects
    active: true
    readOnly: true
    description: Search procedure/table/view/function metadata identities without row data, procedure execution, DDL/DML, or SQL definition text.
    input:
      type: object
      required: [dbProfileId, query]
      properties:
        dbProfileId: { type: string }
        query: { type: string }
        objectTypes:
          type: array
          default: [PROCEDURE, TABLE, VIEW, FUNCTION]
          items:
            type: string
            enum: [PROCEDURE, TABLE, VIEW, FUNCTION]
        limit: { type: integer, default: 20 }

  - name: get_procedure_definition
    active: true
    readOnly: true
    description: Return stored procedure definition text for direct analysis plus standardized hash, length, pattern, access, caveat, and review metadata.
    input:
      type: object
      required: [dbProfileId, schema, procedureName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        procedureName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_procedure_parameters
    active: true
    readOnly: true
    description: Return stored procedure parameter metadata.
    input:
      type: object
      required: [dbProfileId, schema, procedureName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        procedureName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_procedure_dependencies
    active: true
    readOnly: true
    description: Return stored procedure dependency metadata with same-database and same-server cross-database catalog resolution evidence. Raw definition text and row data are never returned by this tool.
    input:
      type: object
      required: [dbProfileId, schema, procedureName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        procedureName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }
    output:
      type: object
      required: [schema, procedureName, dependencies, dependencySummary]
      properties:
        schema: { type: string }
        procedureName: { type: string }
        dependencies:
          type: array
          items:
            $ref: '#/response/dependencyItem'
        definitionMetadata:
          type: object
          description: Hash, length, and pattern metadata computed inside MSSQL; never raw definition text.
          properties:
            hash: { type: string }
            length: { type: integer }
            detectedPatterns:
              type: array
              items: { type: string }
            hasDefinitionAccess: { type: boolean }
        dependencySummary: { type: object }

  - name: get_dependency_closure
    active: true
    readOnly: true
    implementationStatus: fixture_first_hardened_with_explicit_live_gate
    description: Read-only dependency graph tool. Returns bounded procedure/view/function dependency closure using catalog evidence only; no row data, procedure execution, DDL/DML, free-form SQL, or raw definition text.
    input:
      type: object
      required: [dbProfileId, schema, objectName, objectType]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        objectName: { type: string }
        objectType: { type: string, enum: [PROCEDURE, VIEW, FUNCTION] }
        maxDepth: { type: integer, default: 2, maximum: 3 }
        includeReviewRequired: { type: boolean, default: true }
    output:
      type: object
      required: [rootObject, nodes, edges, unresolved, summary]
      properties:
        rootObject:
          type: object
          required: [database, schema, name, objectType]
          properties:
            database: { type: string }
            schema: { type: string }
            name: { type: string }
            objectType: { type: string, enum: [PROCEDURE, VIEW, FUNCTION] }
        nodes:
          type: array
          items:
            type: object
            required: [id, schema, name, objectType, evidenceRefs]
            properties:
              id: { type: string }
              database: { type: string }
              server: { type: string, nullable: true }
              schema: { type: string }
              name: { type: string }
              objectType: { type: string }
              sourceScope: { type: string, nullable: true }
              reviewStatus: { type: string, enum: [CONFIRMED, REVIEW_REQUIRED] }
              evidenceRefs:
                type: array
                items:
                  type: object
                  required: [id, source, path]
                  properties:
                    id: { type: string }
                    source: { type: string }
                    path: { type: string }
                    objectType: { type: string }
                    objectName: { type: string }
        edges:
          type: array
          items:
            type: object
            required: [from, to, dependencyType, resolutionStatus, resolutionStrategy, evidenceRefs]
            properties:
              from: { type: string }
              to: { type: string }
              dependencyType: { type: string }
              resolutionStatus: { type: string, enum: [CONFIRMED, REVIEW_REQUIRED] }
              resolutionStrategy: { type: string }
              resolutionConfidence: { type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN] }
              resolutionEvidenceKind: { type: string }
              unresolvedReason: { type: string, nullable: true }
              resolutionChain:
                type: array
                items: { type: object }
              evidenceRefs:
                type: array
                items:
                  type: object
                  required: [id, source, path]
                  properties:
                    id: { type: string }
                    source: { type: string }
                    path: { type: string }
                    objectType: { type: string }
                    objectName: { type: string }
        unresolved:
          type: array
          items:
            $ref: '#/response/dependencyItem'
        summary:
          type: object
          required: [maxDepth, nodeCount, edgeCount, reviewRequiredCount]
          properties:
            maxDepth: { type: integer }
            nodeCount: { type: integer }
            edgeCount: { type: integer }
            reviewRequiredCount: { type: integer }

  - name: resolve_dependency_reference
    active: true
    readOnly: true
    implementationStatus: fixture_first_hardened_with_explicit_live_gate
    description: Read-only dependency resolver. Reinterprets unresolved, caller-dependent, cross-database, or synonym references using catalog evidence only; ambiguous or unsafe references remain REVIEW_REQUIRED.
    input:
      type: object
      required: [dbProfileId, sourceObject, referencedName]
      properties:
        dbProfileId: { type: string }
        sourceObject:
          type: object
          required: [schema, name, objectType]
          properties:
            database: { type: string }
            schema: { type: string }
            name: { type: string }
            objectType: { type: string, enum: [PROCEDURE, VIEW, FUNCTION] }
        referencedDatabase: { type: string }
        referencedServer: { type: string }
        referencedSchema: { type: string }
        referencedName: { type: string }
    output:
      type: object
      required: [candidates, selectedResolution, resolutionStatus, resolutionStrategy, evidenceRefs, caveats]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [schema, name, objectType, resolutionConfidence, evidenceRefs]
            properties:
              database: { type: string }
              server: { type: string, nullable: true }
              schema: { type: string }
              name: { type: string }
              objectType: { type: string }
              sourceScope: { type: string, nullable: true }
              resolutionConfidence: { type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN] }
              resolutionEvidenceKind: { type: string }
              evidenceRefs:
                type: array
                items:
                  type: object
                  required: [id, source, path]
                  properties:
                    id: { type: string }
                    source: { type: string }
                    path: { type: string }
                    objectType: { type: string }
                    objectName: { type: string }
        selectedResolution:
          type: object
          nullable: true
          description: Present only when catalog evidence uniquely confirms a dependency target.
        resolutionStatus: { type: string, enum: [CONFIRMED, REVIEW_REQUIRED] }
        resolutionStrategy: { type: string }
        resolutionConfidence: { type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN] }
        resolutionEvidenceKind: { type: string }
        unresolvedReason: { type: string, nullable: true }
        resolutionChain:
          type: array
          items: { type: object }
        evidenceRefs:
          type: array
          items:
            type: object
            required: [id, source, path]
            properties:
              id: { type: string }
              source: { type: string }
              path: { type: string }
              objectType: { type: string }
              objectName: { type: string }
        caveats:
          type: array
          items: { type: string }

  - name: get_related_db_objects
    active: true
    readOnly: true
    description: Return related table/view/function objects.
    input:
      type: object
      required: [dbProfileId, schema, objectName, objectType]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        objectName: { type: string }
        objectType: { type: string, enum: [PROCEDURE, TABLE, VIEW, FUNCTION] }
        topK: { type: integer, default: 20 }

  - name: get_table_schema
    active: true
    readOnly: true
    description: Return columns and data types for a table.
    input:
      type: object
      required: [dbProfileId, schema, tableName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        tableName: { type: string }

  - name: get_table_constraints
    active: true
    readOnly: true
    description: Return PK/FK/UQ/CHECK constraints for a table.
    input:
      type: object
      required: [dbProfileId, schema, tableName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        tableName: { type: string }

  - name: get_table_indexes
    active: true
    readOnly: true
    description: Return index metadata for a table.
    input:
      type: object
      required: [dbProfileId, schema, tableName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        tableName: { type: string }

  - name: get_extended_properties
    active: true
    readOnly: true
    description: Return descriptions and logical names.
    input:
      type: object
      required: [dbProfileId, schema, objectName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        objectName: { type: string }
        objectType: { type: string, enum: [PROCEDURE, TABLE, COLUMN, VIEW, FUNCTION] }

  - name: get_view_definition
    active: true
    readOnly: true
    description: Return view definition text for direct analysis plus standardized hash, length, pattern, access, dependency, caveat, and review metadata.
    input:
      type: object
      required: [dbProfileId, schema, viewName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        viewName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_function_definition
    active: true
    readOnly: true
    description: Return function definition text for direct analysis plus standardized hash, length, pattern, access, dependency, caveat, and review metadata.
    input:
      type: object
      required: [dbProfileId, schema, functionName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        functionName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: search_tables
    active: true
    readOnly: true
    description: Search tables by name, description, or column structure.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        physicalName: { type: string }
        logicalName: { type: string }
        description: { type: string }
        columns:
          type: array
          items: { type: string }
        topK: { type: integer, default: 5 }

  - name: search_columns
    active: true
    readOnly: true
    description: Search columns by physical/logical name or description.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        physicalName: { type: string }
        logicalName: { type: string }
        description: { type: string }
        tableName: { type: string }
        topK: { type: integer, default: 5 }

  - name: find_similar_tables
    active: true
    readOnly: true
    description: Recommend similar tables using metadata signals.
    input:
      type: object
      required: [dbProfileId, columns]
      properties:
        dbProfileId: { type: string }
        description: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              type: { type: string }
        topK: { type: integer, default: 5 }
