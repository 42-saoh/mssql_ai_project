version: 0.1.0
service: mssqlMetadata
readOnly: true
tools:
  - name: get_procedure_definition
    description: Return stored procedure definition metadata.
    input:
      type: object
      required: [dbProfileId, schema, procedureName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        procedureName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_procedure_parameters
    description: Return stored procedure parameter metadata.
    input:
      type: object
      required: [dbProfileId, schema, procedureName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        procedureName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_procedure_dependencies
    description: Return stored procedure dependency metadata.
    input:
      type: object
      required: [dbProfileId, schema, procedureName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        procedureName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_related_db_objects
    description: Return related table/view/function objects.
    input:
      type: object
      required: [dbProfileId, schema, objectName, objectType]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        objectName: { type: string }
        objectType: { type: string, enum: [PROCEDURE, TABLE, VIEW, FUNCTION] }
        topK: { type: integer, default: 20 }

  - name: get_table_schema
    description: Return columns and data types for a table.
    input:
      type: object
      required: [dbProfileId, schema, tableName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        tableName: { type: string }

  - name: get_table_constraints
    description: Return PK/FK/UQ/CHECK constraints for a table.
    input:
      type: object
      required: [dbProfileId, schema, tableName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        tableName: { type: string }

  - name: get_table_indexes
    description: Return index metadata for a table.
    input:
      type: object
      required: [dbProfileId, schema, tableName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        tableName: { type: string }

  - name: get_extended_properties
    description: Return descriptions and logical names.
    input:
      type: object
      required: [dbProfileId, schema, objectName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        objectName: { type: string }
        objectType: { type: string, enum: [PROCEDURE, TABLE, COLUMN, VIEW, FUNCTION] }

  - name: get_view_definition
    description: Return view definition metadata.
    input:
      type: object
      required: [dbProfileId, schema, viewName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        viewName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: get_function_definition
    description: Return function definition metadata.
    input:
      type: object
      required: [dbProfileId, schema, functionName]
      properties:
        dbProfileId: { type: string }
        schema: { type: string }
        functionName: { type: string }
        snapshotMode: { type: string, enum: [LATEST, PINNED] }
        snapshotId: { type: string }

  - name: search_tables
    description: Search tables by name, description, or column structure.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        physicalName: { type: string }
        logicalName: { type: string }
        description: { type: string }
        columns:
          type: array
          items: { type: string }
        topK: { type: integer, default: 5 }

  - name: search_columns
    description: Search columns by physical/logical name or description.
    input:
      type: object
      required: [dbProfileId]
      properties:
        dbProfileId: { type: string }
        physicalName: { type: string }
        logicalName: { type: string }
        description: { type: string }
        tableName: { type: string }
        topK: { type: integer, default: 5 }

  - name: find_similar_tables
    description: Recommend similar tables using metadata signals.
    input:
      type: object
      required: [dbProfileId, columns]
      properties:
        dbProfileId: { type: string }
        description: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              type: { type: string }
        topK: { type: integer, default: 5 }
