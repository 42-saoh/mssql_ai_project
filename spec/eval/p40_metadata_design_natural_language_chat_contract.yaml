contract_id: p40_metadata_design_natural_language_chat
version: 0.1.0
production_ready: false
summary: >
  P40 extends P38 durable metadata design runs with natural-language chat intent
  extraction and multi-turn refinement while keeping generated table scripts
  non-executable previews.
required_paths:
  - /api/v1/metadata/design-runs
  - /api/v1/metadata/design-runs/{runId}
  - /api/v1/metadata/design-conversations/{conversationId}
storage:
  reuse_manual_sql: db/schema/ai_agent_platform_schema_v10_metadata_design_runs.sql
  table: dbo.METADATA_DESIGN_RUNS
  no_new_ddl: true
input_contract:
  conversation_modes:
    - NEW_DESIGN
    - REFINE_CURRENT
  fields_api_compat_only: true
  web_field_rows_removed: true
result_contract:
  required_fields:
    - interpretedIntent
    - appliedChanges
    - relatedMetadata
    - standardizationMappings
    - tableProposal
    - dtoDraft
  table_script_field: createTableScriptPreview
  dto_preview_artifact_type: DTO_DRAFT
  not_workflow_artifacts: true
natural_language_examples:
  new_design:
    - 고객명, 주소, 주문일이 있는 주문 요청 테이블
    - Create an order request table with customer name, address, and order date.
  refine:
    - 배송메모 추가
    - 주문일은 날짜 타입으로 바꿔
    - 주소 필드는 빼줘
required_evidence:
  - search_columns
  - search_tables
  - find_similar_tables
  - get_table_schema
  - platform_db_standardization_rules_for_ai
review_required_when:
  - REFINE_CURRENT has no latest SUCCEEDED baseline
  - refinement instruction is ambiguous
  - no similar metadata was found
  - name or type was inferred from policy only
  - PK/FK/index structure is not confirmed
forbidden:
  - rowData
  - rawPrompt
  - rawProviderResponse
  - fullSqlDefinition
  - storedProcedureExecution
  - automaticDdlApply
  - workflowArtifactPersistence
  - DDL_DRAFT
  - DTO_MODEL_DRAFT
  - VO_DRAFT
  - MODEL_DRAFT
