services:
  python-test:
    build:
      context: ${WORKTREE_PATH:-../..}
      dockerfile: docker/test/Dockerfile.python
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${WORKTREE_PATH:-../..}
        target: /workspace
      - pip-cache:/root/.cache/pip
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PLATFORM_DB_HOST: ${PLATFORM_DB_DOCKER_HOST:-host.docker.internal}
      PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:-1433}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-PLF}
      AUTH_RBAC_LIVE_GATE: ${AUTH_RBAC_LIVE_GATE:-0}
      AUTH_RBAC_ENFORCEMENT: ${AUTH_RBAC_ENFORCEMENT:-0}
      P21_LIVE_PORTAL_GATE: ${P21_LIVE_PORTAL_GATE:-0}
      P21_METADATA_SEARCH_QUERY: ${P21_METADATA_SEARCH_QUERY:-proc}
      P21_APPROVAL_REVIEWER_LOGIN: ${P21_APPROVAL_REVIEWER_LOGIN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_REVIEWER_BEARER_TOKEN: ${OIDC_REVIEWER_BEARER_TOKEN:-}
      OIDC_USER_BEARER_TOKEN: ${OIDC_USER_BEARER_TOKEN:-}
      P15_HARD_LIVE_GATE: ${P15_HARD_LIVE_GATE:-0}
      MSSQL_ENABLE_LIVE_METADATA: ${MSSQL_ENABLE_LIVE_METADATA:-0}
      MSSQL_METADATA_HOST: ${MSSQL_METADATA_DOCKER_HOST:-host.docker.internal}
      MSSQL_METADATA_PORT: ${MSSQL_METADATA_PORT:-1433}
      MSSQL_METADATA_USER: ${MSSQL_METADATA_USER:-}
      MSSQL_METADATA_PASSWORD: ${MSSQL_METADATA_PASSWORD:-}
      MSSQL_METADATA_DB: ${MSSQL_METADATA_DB:-master}
      MSSQL_METADATA_DEFAULT_PROFILE_ID: ${MSSQL_METADATA_DEFAULT_PROFILE_ID:-master}
      MSSQL_METADATA_PROFILE_FILE: ${MSSQL_METADATA_PROFILE_FILE:-config/mssql/local_docker_profiles.yaml}
      MSSQL_METADATA_CONNECT_TIMEOUT_SECONDS: ${MSSQL_METADATA_CONNECT_TIMEOUT_SECONDS:-5}

  web-test:
    build:
      context: ${WORKTREE_PATH:-../..}
      dockerfile: docker/test/Dockerfile.web
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${WORKTREE_PATH:-../..}
        target: /workspace
      - pnpm-store:/pnpm/store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CI: "1"
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
      PLATFORM_DB_HOST: ${PLATFORM_DB_DOCKER_HOST:-host.docker.internal}
      PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:-1433}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-PLF}
      P21_LIVE_PORTAL_GATE: ${P21_LIVE_PORTAL_GATE:-0}
      P21_METADATA_SEARCH_QUERY: ${P21_METADATA_SEARCH_QUERY:-proc}
      P21_APPROVAL_REVIEWER_LOGIN: ${P21_APPROVAL_REVIEWER_LOGIN:-}
      PORTAL_API_MODE: ${PORTAL_API_MODE:-http}
      PORTAL_API_BASE_URL: ${PORTAL_API_BASE_URL:-}
      MSSQL_ENABLE_LIVE_METADATA: ${MSSQL_ENABLE_LIVE_METADATA:-0}
      MSSQL_METADATA_HOST: ${MSSQL_METADATA_DOCKER_HOST:-host.docker.internal}
      MSSQL_METADATA_PORT: ${MSSQL_METADATA_PORT:-1433}
      MSSQL_METADATA_USER: ${MSSQL_METADATA_USER:-}
      MSSQL_METADATA_PASSWORD: ${MSSQL_METADATA_PASSWORD:-}
      MSSQL_METADATA_DB: ${MSSQL_METADATA_DB:-master}
      MSSQL_METADATA_DEFAULT_PROFILE_ID: ${MSSQL_METADATA_DEFAULT_PROFILE_ID:-master}
      MSSQL_METADATA_PROFILE_FILE: ${MSSQL_METADATA_PROFILE_FILE:-config/mssql/local_docker_profiles.yaml}
      MSSQL_METADATA_CONNECT_TIMEOUT_SECONDS: ${MSSQL_METADATA_CONNECT_TIMEOUT_SECONDS:-5}

volumes:
  pip-cache:
  pnpm-store:
