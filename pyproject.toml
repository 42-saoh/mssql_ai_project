[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-analysis-agent-platform"
version = "0.1.0"
description = "Starter monorepo for MSSQL analysis, documentation, and conversion-code agent platform."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.13.1",
  "pyyaml>=6.0.2",
  "httpx>=0.28.1",
  "PyJWT[crypto]>=2.10.1",
  "python-tds>=1.17.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.14.0",
  "mypy>=1.15.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["packages/domain/src", "packages/analysis/src", "packages/generation/src", "packages/validation/src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
