plan_id: codex-parallel-local-v3-productization
project: MSSQL 분석·문서화·전환코드 생성 Agent 구축
mode: local-codex-cli-worktrees
basis:
  - PROJECT.md
  - AGENTS.md
  - ARCHITECTURE.md
  - TOOLS.md
  - POLICY.md
  - EVAL_SPEC.md
  - spec/openapi/ai_agent_platform_openapi_v1.yaml
  - spec/mcp/mssql_metadata_tool_catalog.yaml
  - spec/validation/validation_rules.yaml
  - spec/policy/project_ai_java_mybatis_generation_policy.yaml
  - spec/policy/platform_db_standardization_rules_for_ai.json
  - .env.example
  - pnpm-lock.yaml
  - config/mssql/local_docker_profiles.yaml
  - fixtures/pilot/ppm_object_selection_v1/selected_objects.yaml
profiles:
  coordinator: safe-explore
  worker: dev-edit
  reviewer: review
preflight:
  - git status --short
  - corepack enable
  - corepack use pnpm@10.33.0
  - pnpm install --frozen-lockfile
  - cp .env.example .env  # local only; fill secrets manually and never commit .env
  - make docker-project-name
  - make dev-ports
  - make test-build
  - python3.14 -m compileall apps services packages tests
dev_port_strategy:
  script: scripts/resolve_dev_ports.sh
  app_base: 8000
  mcp_base: 8100
  web_base: 3000
  rule: pNN-* worktree uses base+NN, otherwise path-hash slot is used unless WORKTREE_PORT_SLOT is set
reproducibility:
  python_lock: requirements/lock/py314-dev.txt
  metadata_profile_registry: config/mssql/local_docker_profiles.yaml
  web_lock: pnpm-lock.yaml
  python_install_script: scripts/install_python_locked.sh
  web_install_script: scripts/install_web_workspace.sh
  env_sample: .env.example
  env_example: .env.example
shared_read_only_after_p00:
  - AGENTS.md
  - PROJECT.md
  - ARCHITECTURE.md
  - TOOLS.md
  - POLICY.md
  - EVAL_SPEC.md
  - TASK_TEMPLATE.md
  - packages/domain/
  - spec/openapi/
  - spec/policy/
  - db/schema/
  - docker/test/
  - requirements/lock/
  - pnpm-lock.yaml
  - config/mssql/local_docker_profiles.yaml
productization_read_only_after_p08a:
  - fixtures/pilot/ppm_object_selection_v1/selected_objects.yaml
  - fixtures/pilot/ppm_object_selection_v1/candidate_inventory_template.yaml
  - PROJECT.md
  - ARCHITECTURE.md
  - POLICY.md
  - EVAL_SPEC.md
  - spec/openapi/
  - spec/policy/
  - db/schema/
waves:
  - wave: W0
    description: baseline freeze and shared contract drift check
    tracks:
      - id: P00
        branch: feat/p00-baseline
        worktree: ../wt/p00-baseline
        prompt: prompts/00_coordinator_baseline.md
        role: architect
        skills: [repo-bootstrap, contract-to-code, docs-sync]
        target_paths:
          - AGENTS.md
          - PROJECT.md
          - ARCHITECTURE.md
          - TOOLS.md
          - POLICY.md
          - EVAL_SPEC.md
          - TASK_TEMPLATE.md
          - .codex/
          - .agents/
          - Makefile
          - .env.example
          - config/mssql/local_docker_profiles.yaml
          - pyproject.toml
          - package.json
          - apps/web/package.json
          - packages/domain/
          - db/schema/
          - spec/openapi/
          - spec/mcp/
          - spec/validation/
          - spec/policy/
          - docs/adr/
          - docker/test/
          - requirements/lock/
          - scripts/
          - ops/codex-parallel/
          - tests/contract/
        verify:
          - make docker-project-name
          - make dev-ports
          - python3.14 -m compileall apps services packages tests
          - make test
          - make test-web-smoke
  - wave: W1
    description: parallel independent implementation tracks
    tracks:
      - id: P01
        branch: feat/p01-mssql-mcp
        worktree: ../wt/p01-mssql-mcp
        prompt: prompts/01_mssql_mcp.md
        role: mcp_engineer
