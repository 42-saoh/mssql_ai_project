registryVersion: java_mybatis_templates_v1
registryName: java-mybatis-draft-template-registry
policyRef: spec/policy/project_ai_java_mybatis_generation_policy.yaml
templates:
  java_mybatis_sp_wrapper:
    version: 0.2.0
    requestedOutputType: JAVA_MYBATIS_DRAFT
    description: Java/MyBatis 저장 프로시저 wrapper 초안 bundle.
    draftQualityPolicyRef: draftQualityChecks
    outputRoles:
      dto:
        artifactType: DTO_DRAFT
        classNamePolicy: classNames.dto
        packageLayer: model
      service:
        artifactType: SERVICE_DRAFT
        classNamePolicy: classNames.service
        packageLayer: service
      mapperInterface:
        artifactType: MAPPER_INTERFACE
        classNamePolicy: classNames.mapper
        packageLayer: mapper
      mapperXml:
        artifactType: MAPPER_XML
        pathPolicy: mybatis.mapperXmlPath
    sqlRiskMarkers:
      - code: SP_EXEC_WRAPPER
        status: REVIEW_REQUIRED
        description: Mapper XML은 EXEC 저장 프로시저 wrapper를 유지하며 생성 과정에서는 실행하지 않는다.
      - code: SQL_REBUILD_NOT_CONFIRMED
        status: REVIEW_REQUIRED
        description: 더 강한 근거가 없으면 저장 프로시저 로직을 inline SQL로 재구성하지 않는다.
      - code: PARAMETER_BINDING_REVIEW_REQUIRED
        status: REVIEW_REQUIRED
        description: 적용 전 procedure metadata 기준으로 parameter binding을 확인해야 한다.
    draftQualityCaveats:
      - sql_risk_markers_explained
      - unconfirmed_areas_listed
      - generated_diff_is_preview_only
  java_mybatis_dto_model_bundle:
    version: 0.1.0
    requestedOutputType: DTO_MODEL_DRAFT
    description: metadata-only field evidence 기반 DTO/VO/Model 초안 bundle.
    draftQualityPolicyRef: draftQualityChecks
    outputRoles:
      dto:
        artifactType: DTO_DRAFT
        classNamePolicy: classNames.dto
        packageLayer: model
      vo:
        artifactType: VO_DRAFT
        classNamePolicy: classNames.vo
        packageLayer: model
      model:
        artifactType: MODEL_DRAFT
        classNamePolicy: classNames.model
        packageLayer: model
    sqlRiskMarkers:
      - code: NO_SQL_RENDERED
        status: PASS
        description: DTO/VO/Model 초안에는 실행 가능한 SQL이 포함되지 않는다.
      - code: FIELD_MAPPING_REVIEW_REQUIRED
        status: REVIEW_REQUIRED
        description: field name과 Java type은 검토 전까지 초안 mapping으로 유지한다.
    draftQualityCaveats:
      - dto_vo_model_final_choice_flagged
      - field_mapping_evidence_linked
      - generated_diff_is_preview_only
