registryVersion: java_mybatis_templates_v2
registryName: java-mybatis-draft-template-registry
policyRef: spec/policy/project_ai_java_mybatis_generation_policy.yaml
templates:
  java_mybatis_sp_wrapper:
    version: 0.3.0
    requestedOutputType: JAVA_MYBATIS_DRAFT
    description: Evidence-backed Java/MyBatis draft bundle for DTO, service, mapper interface, and mapper XML.
    draftQualityPolicyRef: draftQualityChecks
    outputRoles:
      dto:
        artifactType: DTO_DRAFT
        classNamePolicy: classNames.dto
        packageLayer: model
      service:
        artifactType: SERVICE_DRAFT
        classNamePolicy: classNames.service
        packageLayer: service
      mapperInterface:
        artifactType: MAPPER_INTERFACE
        classNamePolicy: classNames.mapper
        packageLayer: mapper
      mapperXml:
        artifactType: MAPPER_XML
        pathPolicy: mybatis.mapperXmlPath
    generationModes:
      - spWrapper
      - spRebuild
      - evidenceReconstructed
    sqlRiskMarkers:
      - code: EVIDENCE_RECONSTRUCTED_SQL
        status: REVIEW_REQUIRED
        description: Mapper XML is a bounded sanitized SQL skeleton, not production-ready SQL.
      - code: SQL_REBUILD_REVIEW_REQUIRED
        status: REVIEW_REQUIRED
        description: Unconfirmed SELECT/JOIN/WHERE/UPDATE/DELETE clauses must remain marked REVIEW_REQUIRED.
      - code: PARAMETER_BINDING_REVIEW_REQUIRED
        status: REVIEW_REQUIRED
        description: Parameter binding must be checked against procedure metadata before implementation.
    draftQualityCaveats:
      - sql_risk_markers_explained
      - unconfirmed_areas_listed
      - generated_diff_is_preview_only
